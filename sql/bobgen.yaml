no_factory: true
wipe: true
sqlite:
  dsn: "../data.sqlite"
  except:
    game_server_readiness:
plugins_preset: 'none' # Valid values are "default", "all" or "none".
plugins:
  dbinfo:
    disabled: false
    pkgname: 'dbinfo'
    destination: 'models/dbinfo'
  enums:
    disabled: false
    pkgname: 'enums'
    destination: 'models/enums'
  models:
    disabled: false
    pkgname: 'models'
    destination: 'models'
  factory:
    disabled: true
    pkgname: 'factory'
    destination: 'models/factory'
  dberrors:
    disabled: false
    pkgname: 'dberrors'
    destination: 'models/dberrors'
  where:
    disabled: false
  loaders:
    disabled: false
  joins:
    disabled: false
  counts:
    disabled: false
