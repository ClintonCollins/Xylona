}

// GenerateNodePairingObjectRequest triggers issuance of a single-use join
// token for bootstrapping a new xylona-node binary.
message GenerateNodePairingObjectRequest {
  // Optional display hint; currently unused but retained for UI round-tripping.
  string target_url = 1;
}

message GenerateNodePairingObjectResponse {
  // Base URL the new node should contact (typically the controller's public
  // URL, echoed back from the request for the UI's convenience).
  string base_url = 1;
  // Plaintext one-time token. The node presents this on POST /api/node/bootstrap.
  string pairing_token = 2;
}

message RemoveNodeRequest {
  string node_id = 1;
}

message RemoveNodeResponse {
  Node node = 1;
}

message EditNodeRequest {
  Node node = 1;
}

message EditNodeResponse {
  Node node = 1;
}

enum SystemUpdateComponent {
  SYSTEM_UPDATE_COMPONENT_UNSPECIFIED = 0;
  SYSTEM_UPDATE_COMPONENT_CONTROLLER = 1;
  SYSTEM_UPDATE_COMPONENT_NODE = 2;
}

enum SystemUpdateJobStatus {
  SYSTEM_UPDATE_JOB_STATUS_UNSPECIFIED = 0;
  SYSTEM_UPDATE_JOB_STATUS_PENDING = 1;
  SYSTEM_UPDATE_JOB_STATUS_RUNNING = 2;
  SYSTEM_UPDATE_JOB_STATUS_DRAINING = 3;
  SYSTEM_UPDATE_JOB_STATUS_DOWNLOADING = 4;
  SYSTEM_UPDATE_JOB_STATUS_STAGING = 5;
  SYSTEM_UPDATE_JOB_STATUS_APPLYING = 6;
  SYSTEM_UPDATE_JOB_STATUS_RESTARTING = 7;
  SYSTEM_UPDATE_JOB_STATUS_SUCCEEDED = 8;
  SYSTEM_UPDATE_JOB_STATUS_FAILED = 9;
}

enum SystemUpdatePhase {
  SYSTEM_UPDATE_PHASE_UNSPECIFIED = 0;
  SYSTEM_UPDATE_PHASE_CHECK = 1;
  SYSTEM_UPDATE_PHASE_PREFLIGHT = 2;
  SYSTEM_UPDATE_PHASE_DRAIN = 3;
  SYSTEM_UPDATE_PHASE_DOWNLOAD = 4;
  SYSTEM_UPDATE_PHASE_VERIFY = 5;
  SYSTEM_UPDATE_PHASE_STAGE = 6;
  SYSTEM_UPDATE_PHASE_APPLY = 7;
  SYSTEM_UPDATE_PHASE_RESTART = 8;
  SYSTEM_UPDATE_PHASE_COMPLETE = 9;
  SYSTEM_UPDATE_PHASE_FAILURE = 10;
}

message SystemUpdateAvailability {
  SystemUpdateComponent component = 1;
  string node_id = 2;
  string node_name = 3;
  string current_version = 4;
  string latest_version = 5;
  bool update_available = 6;
  bool updateable = 7;
  string reason = 8;
  string os = 9;
