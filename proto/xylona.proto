syntax = "proto3";
import "google/protobuf/timestamp.proto";
import "gameserver_files_operations.proto";
import "shared.proto";

package xylona;
option go_package = 'github.com/ClintonCollins/Xylona/proto/go/xylona';

service Xylona {
  // Game Operations
  rpc AddGame (AddGameRequest) returns (AddGameResponse) {}
  rpc EditGame (EditGameRequest) returns (EditGameResponse) {}
  rpc UpdateGameStartArgsTemplate (UpdateGameStartArgsTemplateRequest) returns (UpdateGameStartArgsTemplateResponse) {}
  rpc UpdateGameStartArgBlocklist (UpdateGameStartArgBlocklistRequest) returns (UpdateGameStartArgBlocklistResponse) {}
  rpc GetGameEnvironment (GetGameEnvironmentRequest) returns (GetGameEnvironmentResponse) {}
  rpc UpdateGameEnvironment (UpdateGameEnvironmentRequest) returns (UpdateGameEnvironmentResponse) {}
  rpc GetGame (GetGameRequest) returns (GetGameResponse) {}
  rpc RemoveGame (RemoveGameRequest) returns (RemoveGameResponse) {}
  rpc ImportGame (ImportGameRequest) returns (ImportGameResponse) {}
  rpc ExportGame (ExportGameRequest) returns (ExportGameResponse) {}
  rpc ResetGameToOfficialDefinition (ResetGameToOfficialDefinitionRequest) returns (ResetGameToOfficialDefinitionResponse) {}
  rpc ListGames (ListGamesRequest) returns (ListGamesResponse) {}

  // Steam App Lookup
  rpc SearchSteamApps (SearchSteamAppsRequest) returns (SearchSteamAppsResponse) {}
  rpc GetSteamAppDetails (GetSteamAppDetailsRequest) returns (GetSteamAppDetailsResponse) {}

  // General
  rpc Login (LoginRequest) returns (LoginResponse) {}
  rpc Logout (LogoutRequest) returns (LogoutResponse) {}
  rpc CheckUserAuthenticated (CheckUserAuthenticatedRequest) returns (CheckUserAuthenticatedResponse) {}
  rpc CreateUser (CreateUserRequest) returns (CreateUserResponse) {}
  rpc ListUsers (ListUsersRequest) returns (ListUsersResponse) {}
  rpc GetUser (GetUserDetailsRequest) returns (GetUserDetailsResponse) {}
  rpc UpdateUser (UpdateUserRequest) returns (UpdateUserResponse) {}
  rpc DeleteUser (DeleteUserRequest) returns (DeleteUserResponse) {}
  rpc ListRoles (ListRolesRequest) returns (ListRolesResponse) {}
  rpc ListPermissions (ListPermissionsRequest) returns (ListPermissionsResponse) {}
  rpc CreateRole (CreateRoleRequest) returns (CreateRoleResponse) {}
  rpc DeleteRole (DeleteRoleRequest) returns (DeleteRoleResponse) {}
  rpc ListGameServerAccessGrants (ListGameServerAccessGrantsRequest) returns (ListGameServerAccessGrantsResponse) {}
  rpc GrantGameServerAccess (GrantGameServerAccessRequest) returns (GrantGameServerAccessResponse) {}
  rpc RevokeGameServerAccess (RevokeGameServerAccessRequest) returns (RevokeGameServerAccessResponse) {}
  rpc ListIPs (ListIPsRequest) returns (ListIPsResponse) {}
  rpc AddIP (AddIPRequest) returns (AddIPResponse) {}
  rpc RemoveIP (RemoveIPRequest) returns (RemoveIPResponse) {}

  // Game Server Operations
  rpc CreateGameServer (CreateGameServerRequest) returns (CreateGameServerResponse) {}
  rpc EditGameServer (EditGameServerRequest) returns (EditGameServerResponse) {}
  rpc RemoveGameServer (RemoveGameServerRequest) returns (RemoveGameServerResponse) {}
  rpc StartGameServer (StartGameServerRequest) returns (StartGameServerResponse) {}
  rpc StopGameServer (StopGameServerRequest) returns (StopGameServerResponse) {}
  rpc RestartGameServer (RestartGameServerRequest) returns (RestartGameServerResponse) {}
  rpc ReadGameServerOutput (ReadGameServerOutputRequest) returns (ReadGameServerOutputResponse) {}
  rpc SendGameServerInput (SendGameServerInputRequest) returns (SendGameServerInputResponse) {}
  rpc GetGameServer (GetGameServerRequest) returns (GetGameServerResponse) {}
  rpc UpdateGameServer (UpdateGameServerRequest) returns (UpdateGameServerResponse) {}
  rpc UpdateGameServerStartArgs (UpdateGameServerStartArgsRequest) returns (UpdateGameServerStartArgsResponse) {}
  rpc GetGameServerEnvironment (GetGameServerEnvironmentRequest) returns (GetGameServerEnvironmentResponse) {}
  rpc UpdateGameServerEnvironment (UpdateGameServerEnvironmentRequest) returns (UpdateGameServerEnvironmentResponse) {}
  rpc SetGameServerSecretEnv (SetGameServerSecretEnvRequest) returns (SetGameServerSecretEnvResponse) {}
  rpc ClearGameServerSecretEnv (ClearGameServerSecretEnvRequest) returns (ClearGameServerSecretEnvResponse) {}
  rpc GetGameServerAdminInterface (GetGameServerAdminInterfaceRequest) returns (GetGameServerAdminInterfaceResponse) {}
  rpc SetGameServerAdminInterfacePassword (SetGameServerAdminInterfacePasswordRequest) returns (SetGameServerAdminInterfacePasswordResponse) {}
  rpc GetGameServerReadiness (GetGameServerReadinessRequest) returns (GetGameServerReadinessResponse) {}
  rpc AcceptMinecraftEula (AcceptMinecraftEulaRequest) returns (AcceptMinecraftEulaResponse) {}
  rpc SetSteamGSLT (SetSteamGSLTRequest) returns (SetSteamGSLTResponse) {}
  rpc ClearSteamGSLT (ClearSteamGSLTRequest) returns (ClearSteamGSLTResponse) {}
  rpc StartHytaleDeviceAuth (StartHytaleDeviceAuthRequest) returns (StartHytaleDeviceAuthResponse) {}
  rpc PollHytaleDeviceAuth (PollHytaleDeviceAuthRequest) returns (PollHytaleDeviceAuthResponse) {}
  rpc SelectHytaleProfile (SelectHytaleProfileRequest) returns (SelectHytaleProfileResponse) {}
  rpc ClearHytaleAccount (ClearHytaleAccountRequest) returns (ClearHytaleAccountResponse) {}
  //  rpc ReinstallGameServer (ReinstallGameServerRequest) returns (ReinstallGameServerResponse) {}
  //  rpc BackupGameServer (BackupGameServerRequest) returns (BackupGameServerResponse) {}
  rpc ListGameServers (ListGameServersRequest) returns (ListGameServersResponse) {}
  rpc QueryGameServer (QueryGameServerRequest) returns (QueryGameServerResponse) {}
  rpc GetGameServerPlayerManagement (GetGameServerPlayerManagementRequest) returns (GetGameServerPlayerManagementResponse) {}
  rpc PerformGameServerPlayerAction (PerformGameServerPlayerActionRequest) returns (PerformGameServerPlayerActionResponse) {}
  rpc GetPalworldMap (GetPalworldMapRequest) returns (GetPalworldMapResponse) {}
  rpc UpdatePalworldMapConfig (UpdatePalworldMapConfigRequest) returns (UpdatePalworldMapConfigResponse) {}
  rpc InstallPalworldMapTiles (InstallPalworldMapTilesRequest) returns (InstallPalworldMapTilesResponse) {}
  rpc RegeneratePalworldMapShare (RegeneratePalworldMapShareRequest) returns (RegeneratePalworldMapShareResponse) {}
  rpc RevokePalworldMapShare (RevokePalworldMapShareRequest) returns (RevokePalworldMapShareResponse) {}
  rpc GetPublicPalworldMap (GetPublicPalworldMapRequest) returns (GetPublicPalworldMapResponse) {}
  rpc GetSevenDaysToDieMap (GetSevenDaysToDieMapRequest) returns (GetSevenDaysToDieMapResponse) {}
  rpc UpdateSevenDaysToDieMapNotes (UpdateSevenDaysToDieMapNotesRequest) returns (UpdateSevenDaysToDieMapNotesResponse) {}
  rpc RegenerateSevenDaysToDieMapShare (RegenerateSevenDaysToDieMapShareRequest) returns (RegenerateSevenDaysToDieMapShareResponse) {}
  rpc RevokeSevenDaysToDieMapShare (RevokeSevenDaysToDieMapShareRequest) returns (RevokeSevenDaysToDieMapShareResponse) {}
  rpc GetPublicSevenDaysToDieMap (GetPublicSevenDaysToDieMapRequest) returns (GetPublicSevenDaysToDieMapResponse) {}
  rpc GetMinecraftMap (GetMinecraftMapRequest) returns (GetMinecraftMapResponse) {}
  rpc UpdateMinecraftMapConfig (UpdateMinecraftMapConfigRequest) returns (UpdateMinecraftMapConfigResponse) {}
  rpc RegenerateMinecraftMapShare (RegenerateMinecraftMapShareRequest) returns (RegenerateMinecraftMapShareResponse) {}
  rpc RevokeMinecraftMapShare (RevokeMinecraftMapShareRequest) returns (RevokeMinecraftMapShareResponse) {}
  rpc GetPublicMinecraftMap (GetPublicMinecraftMapRequest) returns (GetPublicMinecraftMapResponse) {}

  rpc GetUpdateTargets (GetUpdateTargetsRequest) returns (GetUpdateTargetsResponse) {}
  rpc SetServerVariant (SetServerVariantRequest) returns (SetServerVariantResponse) {}
  rpc GetVariantOperationStatus (GetVariantOperationStatusRequest) returns (GetVariantOperationStatusResponse) {}
  // File Operations
  rpc ListDirectoryFiles (ListDirectoryFilesRequest) returns (ListDirectoryFilesResponse) {}
  rpc GameServerFilesDelete (GameServerFilesDeleteRequest) returns (GameServerFilesDeleteResponse) {}
  rpc GameServerFilesArchive (GameServerFilesCompressionRequest) returns (stream GameServerFilesArchiveProgress) {}
  rpc GameServerFilesExtract (GameServerFilesDecompressionRequest) returns (stream GameServerFilesExtractProgress) {}
  rpc GameServerFilesCompress (GameServerFilesCompressionRequest) returns (GameServerFilesCompressionResponse) {}
  rpc GameServerFilesDecompress (GameServerFilesDecompressionRequest) returns (GameServerFilesDecompressionResponse) {}
  rpc GameServerFilesDownloadFromURL (GameServersFileDownloadFromURLRequest) returns (GameServersFileDownloadFromURLResponse) {}
  rpc GameServerFileRename (GameServerFileRenameRequest) returns (GameServerFileRenameResponse) {}
  rpc GameServerFilesMove (GameServerFilesMoveRequest) returns (GameServerFilesMoveResponse) {}
  rpc GameServersFileEdit (GameServersFileEditRequest) returns (GameServersFileEditResponse) {}
  rpc GameServersFileOrDirectoryCreate (GameServerFileOrDirectoryCreateRequest) returns (GameServerFileOrDirectoryCreateResponse) {}

  // Nodes (hub-spoke)
  rpc GetNode (GetNodeRequest) returns (GetNodeResponse) {}
  rpc ListNodes (ListNodesRequest) returns (ListNodesResponse) {}
  // GenerateNodePairingObject issues a single-use join token that a remote
  // xylona-node binary presents during bootstrap (see POST /api/node/bootstrap).
  rpc GenerateNodePairingObject (GenerateNodePairingObjectRequest) returns (GenerateNodePairingObjectResponse) {}
  rpc RemoveNode (RemoveNodeRequest) returns (RemoveNodeResponse) {}
  rpc EditNode (EditNodeRequest) returns (EditNodeResponse) {}

  // System updates (superuser only)
  rpc CheckSystemUpdates (CheckSystemUpdatesRequest) returns (CheckSystemUpdatesResponse) {}
  rpc StartSystemUpdate (StartSystemUpdateRequest) returns (StartSystemUpdateResponse) {}
  rpc ListSystemUpdateJobs (ListSystemUpdateJobsRequest) returns (ListSystemUpdateJobsResponse) {}
  rpc GetSystemUpdateJob (GetSystemUpdateJobRequest) returns (GetSystemUpdateJobResponse) {}

  // Config Schema Management (superuser)
  rpc GetGameConfigSchemas (GetGameConfigSchemasRequest) returns (GetGameConfigSchemasResponse) {}
  rpc UpdateGameConfigSchemas (UpdateGameConfigSchemasRequest) returns (UpdateGameConfigSchemasResponse) {}

  // Config File Editing
  rpc GetGameServerConfigFiles (GetGameServerConfigFilesRequest) returns (GetGameServerConfigFilesResponse) {}
  rpc GetGameServerConfigFile (GetGameServerConfigFileRequest) returns (GetGameServerConfigFileResponse) {}
  rpc UpdateGameServerConfigFile (UpdateGameServerConfigFileRequest) returns (UpdateGameServerConfigFileResponse) {}
  rpc GenerateGameServerConfigFile (GenerateGameServerConfigFileRequest) returns (GenerateGameServerConfigFileResponse) {}

  // Aggregated Views
  rpc ListAggregatedGameServers (ListAggregatedGameServersRequest) returns (ListAggregatedGameServersResponse) {}

  // Dashboard
  rpc GetNodeSystemInfo (GetNodeSystemInfoRequest) returns (GetNodeSystemInfoResponse) {}
  rpc GetNodeResourceSnapshot (GetNodeResourceSnapshotRequest) returns (GetNodeResourceSnapshotResponse) {}
  rpc GetDashboardOverview (GetDashboardOverviewRequest) returns (GetDashboardOverviewResponse) {}
  rpc GetNodeMetricsHistory (GetNodeMetricsHistoryRequest) returns (GetNodeMetricsHistoryResponse) {}
  rpc GetGameServerMetricsHistory (GetGameServerMetricsHistoryRequest) returns (GetGameServerMetricsHistoryResponse) {}

  // Mod management
  rpc SearchMods (SearchModsRequest) returns (SearchModsResponse) {}
  rpc GetModDetails (GetModDetailsRequest) returns (GetModDetailsResponse) {}
  rpc GetModVersions (GetModVersionsRequest) returns (GetModVersionsResponse) {}
  rpc InstallMod (InstallModRequest) returns (InstallModResponse) {}
  rpc UninstallMod (UninstallModRequest) returns (UninstallModResponse) {}
  rpc UpdateMod (UpdateModRequest) returns (UpdateModResponse) {}
  rpc ListInstalledMods (ListInstalledModsRequest) returns (ListInstalledModsResponse) {}
  rpc SetModAutoUpdate (SetModAutoUpdateRequest) returns (SetModAutoUpdateResponse) {}
  rpc SetModEnabled (SetModEnabledRequest) returns (SetModEnabledResponse) {}
  rpc PinModVersion (PinModVersionRequest) returns (PinModVersionResponse) {}

  rpc GetModCategories (GetModCategoriesRequest) returns (GetModCategoriesResponse) {}

  // Version tracking
  rpc GetVersionInfo (GetVersionInfoRequest) returns (GetVersionInfoResponse) {}
  rpc CheckForUpdate (CheckForUpdateRequest) returns (CheckForUpdateResponse) {}
  rpc SetDummyUpdateFailure (SetDummyUpdateFailureRequest) returns (SetDummyUpdateFailureResponse) {}

  // Notification Channels
  rpc CreateNotificationChannel (CreateNotificationChannelRequest) returns (CreateNotificationChannelResponse) {}
  rpc UpdateNotificationChannel (UpdateNotificationChannelRequest) returns (UpdateNotificationChannelResponse) {}
  rpc DeleteNotificationChannel (DeleteNotificationChannelRequest) returns (DeleteNotificationChannelResponse) {}
  rpc ListNotificationChannels (ListNotificationChannelsRequest) returns (ListNotificationChannelsResponse) {}
  rpc TestNotificationChannel (TestNotificationChannelRequest) returns (TestNotificationChannelResponse) {}
  rpc GetLocalSMTPStatus (GetLocalSMTPStatusRequest) returns (GetLocalSMTPStatusResponse) {}

  // Alert Rules
  rpc CreateAlertRule (CreateAlertRuleRequest) returns (CreateAlertRuleResponse) {}
  rpc UpdateAlertRule (UpdateAlertRuleRequest) returns (UpdateAlertRuleResponse) {}
  rpc DeleteAlertRule (DeleteAlertRuleRequest) returns (DeleteAlertRuleResponse) {}
  rpc ListAlertRules (ListAlertRulesRequest) returns (ListAlertRulesResponse) {}

  // Alert History
  rpc GetAlertHistory (GetAlertHistoryRequest) returns (GetAlertHistoryResponse) {}

  // System SMTP (superuser only)
  rpc GetSystemSMTPConfig (GetSystemSMTPConfigRequest) returns (GetSystemSMTPConfigResponse) {}
  rpc SetSystemSMTPConfig (SetSystemSMTPConfigRequest) returns (SetSystemSMTPConfigResponse) {}
  rpc TestSystemSMTP (TestSystemSMTPRequest) returns (TestSystemSMTPResponse) {}
  rpc BeginGoogleMailOAuth (BeginGoogleMailOAuthRequest) returns (BeginGoogleMailOAuthResponse) {}
  rpc DisconnectGoogleMail (DisconnectGoogleMailRequest) returns (DisconnectGoogleMailResponse) {}

  // Scheduled Tasks
  rpc ListScheduledTasks (ListScheduledTasksRequest) returns (ListScheduledTasksResponse) {}
  rpc CreateScheduledTask (CreateScheduledTaskRequest) returns (CreateScheduledTaskResponse) {}
  rpc UpdateScheduledTask (UpdateScheduledTaskRequest) returns (UpdateScheduledTaskResponse) {}
  rpc DeleteScheduledTask (DeleteScheduledTaskRequest) returns (DeleteScheduledTaskResponse) {}
  rpc GetScheduledTaskLogs (GetScheduledTaskLogsRequest) returns (GetScheduledTaskLogsResponse) {}

  // Backups
  rpc GetGameServerBackupOverview (GetGameServerBackupOverviewRequest) returns (GetGameServerBackupOverviewResponse) {}
  rpc GetBackupSettings (GetBackupSettingsRequest) returns (GetBackupSettingsResponse) {}
  rpc UpdateBackupSettings (UpdateBackupSettingsRequest) returns (UpdateBackupSettingsResponse) {}
  rpc ListGameServerBackups (ListGameServerBackupsRequest) returns (ListGameServerBackupsResponse) {}
  rpc CreateGameServerBackup (CreateGameServerBackupRequest) returns (CreateGameServerBackupResponse) {}
  rpc DeleteGameServerBackup (DeleteGameServerBackupRequest) returns (DeleteGameServerBackupResponse) {}
  rpc RestoreGameServerBackup (RestoreGameServerBackupRequest) returns (RestoreGameServerBackupResponse) {}
}

message LoginRequest {
  string user_name = 1;
  string password = 2;
}

message LoginResponse {
  User user = 1;
}

message CreateUserRequest {
  string user_name = 1;
  string email = 2;
  string password = 3;
  string first_name = 4;
  string last_name = 5;
  bool super_user = 6;
}

message CreateUserResponse {
  User user = 1;
  optional Error error = 2;
}

message LogoutRequest {}

message LogoutResponse {}

message CheckUserAuthenticatedRequest {}

message CheckUserAuthenticatedResponse {
  bool authenticated = 1;
  User user = 2;
  repeated string permission_ids = 3;
}

message ListGameServersRequest {}

message ListGameServersResponse {
  repeated GameServer game_servers = 1;
}

message ListGamesRequest {}

message ListGamesResponse {
  repeated Game games = 1;
}

message GetGameRequest {
  string id = 1;
}

message GetGameResponse {
  Game game = 1;
}

message GetGameServerRequest {
  string id = 1;
}

message GetGameServerResponse {
  GameServer game_server = 1;
}

message User {
  string id = 1;
  string user_name = 2;
  string email = 3;
  string first_name = 4;
  string last_name = 5;
  bool super_user = 6;
  google.protobuf.Timestamp last_login = 7;
  google.protobuf.Timestamp created_at = 8;
}

message ListUsersRequest {}

message ListUsersResponse {
  repeated User users = 1;
}

message GetUserDetailsRequest {
  string id = 1;
}

message GetUserDetailsResponse {
  User user = 1;
}

message UpdateUserRequest {
  string id = 1;
  string user_name = 2;
  string email = 3;
  string first_name = 4;
  string last_name = 5;
  bool super_user = 6;
  string password = 7;
}

message UpdateUserResponse {
  User user = 1;
}

message DeleteUserRequest {
  string id = 1;
}

message DeleteUserResponse {}

