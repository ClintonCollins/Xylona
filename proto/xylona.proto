}

message GetUpdateTargetsResponse {
  repeated UpdateTargetOption targets = 1;
  string current_target = 2;
}

message ListIPsRequest {
  string node_id = 1;
}

message ListIPsResponse {
  repeated IP ips = 1;
}

message AddIPRequest {
