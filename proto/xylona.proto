// Version tracking enums and messages
enum UpdateStep {
  UPDATE_STEP_UNSPECIFIED = 0;
  UPDATE_STEP_STOPPING = 1;
  UPDATE_STEP_BACKING_UP = 2;
  UPDATE_STEP_DOWNLOADING = 3;
  UPDATE_STEP_INSTALLING = 4;
  UPDATE_STEP_RESTARTING = 5;
  UPDATE_STEP_ROLLING_BACK = 6;
}

