message RemoveGameResponse {
}

enum GameImportMode {
  GAME_IMPORT_MODE_PREVIEW = 0;
  GAME_IMPORT_MODE_APPLY = 1;
  GAME_IMPORT_MODE_IMPORT_COPY = 2;
}

message ImportGameRequest {
  string game_definition_json = 1;
  GameImportMode mode = 2;
}

message GameImportChange {
  string section = 1;
  string label = 2;
  string path = 3;
  string previous_value = 4;
  string imported_value = 5;
}

message ImportGameResponse {
  Game game = 1;
  optional Error error = 2;
  bool success = 3;
  bool id_conflict = 4;
  bool updates_existing = 5;
  int64 affected_game_server_count = 6;
  repeated string affected_game_server_names = 7;
  repeated string warnings = 8;
  repeated string validation_errors = 9;
  string imported_game_id = 10;
  repeated GameImportChange changes = 11;
}

message ResetGameToOfficialDefinitionRequest {
  string game_id = 1;
}

message ResetGameToOfficialDefinitionResponse {
  Game game = 1;
}

message ExportGameRequest {
