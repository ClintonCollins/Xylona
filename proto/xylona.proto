  SERVER_STARTED = 0;
  SERVER_STOPPED = 1;
  SERVER_UPDATING = 2;
  SERVER_FINISHED_UPDATE = 3;
  SERVER_INSTALLING = 4;
  SERVER_FINISHED_INSTALL = 5;
  MISCELLANEOUS = 6;
}

message NotificationStreamRequest {}

message NotificationStreamResponse {
  NotificationEvent event = 1;
  GameServer game_server = 2;
  string message = 3;
  string error = 4;
}

message GetUpdateTargetsRequest {
