  repeated EnvironmentVariable env_vars = 2;
}

message UpdateGameServerEnvironmentResponse {
  repeated EnvironmentVariable server_env = 1;
  repeated EnvironmentVariable effective_env = 2;
  repeated EnvironmentValidationIssue validation_issues = 3;
