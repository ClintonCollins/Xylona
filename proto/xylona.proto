syntax = "proto3";
import "google/protobuf/timestamp.proto";
import "gameserver_files_operations.proto";
import "shared.proto";
// import "games/minecraft.proto";

package xylona;
option go_package = 'github.com/ClintonCollins/Xylona/proto/go/xylona';

service Xylona {
  // Game Operations
  rpc AddGame (AddGameRequest) returns (AddGameResponse) {}
  rpc EditGame (EditGameRequest) returns (EditGameResponse) {}
  rpc UpdateGameStartArgsTemplate (UpdateGameStartArgsTemplateRequest) returns (UpdateGameStartArgsTemplateResponse) {}
  rpc UpdateGameStartArgBlocklist (UpdateGameStartArgBlocklistRequest) returns (UpdateGameStartArgBlocklistResponse) {}
  rpc GetGame (GetGameRequest) returns (GetGameResponse) {}
  rpc RemoveGame (RemoveGameRequest) returns (RemoveGameResponse) {}
  rpc ImportGame (ImportGameRequest) returns (ImportGameResponse) {}
  rpc ExportGame (ExportGameRequest) returns (ExportGameResponse) {}
  rpc ListGames (ListGamesRequest) returns (ListGamesResponse) {}

  // Steam App Lookup
  rpc SearchSteamApps (SearchSteamAppsRequest) returns (SearchSteamAppsResponse) {}
  rpc GetSteamAppDetails (GetSteamAppDetailsRequest) returns (GetSteamAppDetailsResponse) {}

  // General
  rpc Login (LoginRequest) returns (LoginResponse) {}
  rpc Logout (LogoutRequest) returns (LogoutResponse) {}
  rpc CheckUserAuthenticated (CheckUserAuthenticatedRequest) returns (CheckUserAuthenticatedResponse) {}
  rpc CreateUser (CreateUserRequest) returns (CreateUserResponse) {}
  rpc ListUsers (ListUsersRequest) returns (ListUsersResponse) {}
  rpc GetUser (GetUserDetailsRequest) returns (GetUserDetailsResponse) {}
  rpc UpdateUser (UpdateUserRequest) returns (UpdateUserResponse) {}
  rpc DeleteUser (DeleteUserRequest) returns (DeleteUserResponse) {}
  rpc ListRoles (ListRolesRequest) returns (ListRolesResponse) {}
  rpc ListPermissions (ListPermissionsRequest) returns (ListPermissionsResponse) {}
  rpc CreateRole (CreateRoleRequest) returns (CreateRoleResponse) {}
  rpc DeleteRole (DeleteRoleRequest) returns (DeleteRoleResponse) {}
  rpc ListGameServerAccessGrants (ListGameServerAccessGrantsRequest) returns (ListGameServerAccessGrantsResponse) {}
  rpc GrantGameServerAccess (GrantGameServerAccessRequest) returns (GrantGameServerAccessResponse) {}
  rpc RevokeGameServerAccess (RevokeGameServerAccessRequest) returns (RevokeGameServerAccessResponse) {}
  rpc ListFederatedAccessGrants (ListFederatedAccessGrantsRequest) returns (ListFederatedAccessGrantsResponse) {}
  rpc GrantFederatedAccess (GrantFederatedAccessRequest) returns (GrantFederatedAccessResponse) {}
  rpc RevokeFederatedAccess (RevokeFederatedAccessRequest) returns (RevokeFederatedAccessResponse) {}
  rpc ListIPs (ListIPsRequest) returns (ListIPsResponse) {}
  rpc AddIP (AddIPRequest) returns (AddIPResponse) {}
  rpc RemoveIP (RemoveIPRequest) returns (RemoveIPResponse) {}

  // Game Server Operations
  rpc CreateGameServer (CreateGameServerRequest) returns (CreateGameServerResponse) {}
  rpc EditGameServer (EditGameServerRequest) returns (EditGameServerResponse) {}
  rpc RemoveGameServer (RemoveGameServerRequest) returns (RemoveGameServerResponse) {}
  rpc StartGameServer (StartGameServerRequest) returns (StartGameServerResponse) {}
  rpc StopGameServer (StopGameServerRequest) returns (StopGameServerResponse) {}
  //  rpc RestartGameServer (RestartGameServerRequest) returns (RestartGameServerResponse) {}
  rpc ReadGameServerOutput (ReadGameServerOutputRequest) returns (ReadGameServerOutputResponse) {}
  rpc SendGameServerInput (SendGameServerInputRequest) returns (SendGameServerInputResponse) {}
  rpc GetGameServer (GetGameServerRequest) returns (GetGameServerResponse) {}
  rpc UpdateGameServer (UpdateGameServerRequest) returns (UpdateGameServerResponse) {}
  rpc UpdateGameServerStartArgs (UpdateGameServerStartArgsRequest) returns (UpdateGameServerStartArgsResponse) {}
  //  rpc ReinstallGameServer (ReinstallGameServerRequest) returns (ReinstallGameServerResponse) {}
  //  rpc BackupGameServer (BackupGameServerRequest) returns (BackupGameServerResponse) {}
  rpc ListGameServers (ListGameServersRequest) returns (ListGameServersResponse) {}
  rpc QueryGameServer (QueryGameServerRequest) returns (QueryGameServerResponse) {}

  rpc GetUpdateTargets (GetUpdateTargetsRequest) returns (GetUpdateTargetsResponse) {}
  rpc SetServerVariant (SetServerVariantRequest) returns (SetServerVariantResponse) {}
  rpc GetVariantOperationStatus (GetVariantOperationStatusRequest) returns (GetVariantOperationStatusResponse) {}
  // File Operations
  rpc ListDirectoryFiles (ListDirectoryFilesRequest) returns (ListDirectoryFilesResponse) {}
  rpc GameServerFilesDelete (GameServerFilesDeleteRequest) returns (GameServerFilesDeleteResponse) {}
  rpc GameServerFilesArchive (GameServerFilesCompressionRequest) returns (stream GameServerFilesArchiveProgress) {}
  rpc GameServerFilesExtract (GameServerFilesDecompressionRequest) returns (stream GameServerFilesExtractProgress) {}
  rpc GameServerFilesCompress (GameServerFilesCompressionRequest) returns (GameServerFilesCompressionResponse) {}
  rpc GameServerFilesDecompress (GameServerFilesDecompressionRequest) returns (GameServerFilesDecompressionResponse) {}
  rpc GameServerFilesDownloadFromURL (GameServersFileDownloadFromURLRequest) returns (GameServersFileDownloadFromURLResponse) {}
  rpc GameServerFileRename (GameServerFileRenameRequest) returns (GameServerFileRenameResponse) {}
  rpc GameServerFilesMove (GameServerFilesMoveRequest) returns (GameServerFilesMoveResponse) {}
  rpc GameServersFileEdit (GameServersFileEditRequest) returns (GameServersFileEditResponse) {}
  rpc GameServersFileOrDirectoryCreate (GameServerFileOrDirectoryCreateRequest) returns (GameServerFileOrDirectoryCreateResponse) {}

  // Nodes
  rpc GetNode (GetNodeRequest) returns (GetNodeResponse) {}
  rpc ListNodes (ListNodesRequest) returns (ListNodesResponse) {}
  rpc AddNode (AddNodeRequest) returns (AddNodeResponse) {}
  rpc GenerateNodePairingObject (GenerateNodePairingObjectRequest) returns (GenerateNodePairingObjectResponse) {}
  rpc PairNode (PairNodeRequest) returns (PairNodeResponse) {}
  rpc RemoveNode (RemoveNodeRequest) returns (RemoveNodeResponse) {}
  rpc EditNode (EditNodeRequest) returns (EditNodeResponse) {}
  // Used to reach out to a new node and verify we're authorized when adding it.
  rpc VerifyNode (VerifyNodeRequest) returns (VerifyNodeResponse) {}
  rpc ListRemoteNodeUsers (ListRemoteNodeUsersRequest) returns (ListRemoteNodeUsersResponse) {}
  rpc ListLocalSecretKeys (ListLocalSecretKeysRequest) returns (ListLocalSecretKeysResponse) {}
  rpc CreateLocalSecretKey (CreateLocalSecretKeyRequest) returns (CreateLocalSecretKeyResponse) {}
  rpc DeleteLocalSecretKey (DeleteLocalSecretKeyRequest) returns (DeleteLocalSecretKeyResponse) {}

  rpc SyncNode (SyncNodeRequest) returns (SyncNodeResponse) {}

  // Federation Mesh
  rpc LeaveFederation (LeaveFederationRequest) returns (LeaveFederationResponse) {}
  rpc ListFederationAdvisories (ListFederationAdvisoriesRequest) returns (ListFederationAdvisoriesResponse) {}
  rpc MarkAdvisoriesRead (MarkAdvisoriesReadRequest) returns (MarkAdvisoriesReadResponse) {}
  rpc GetUnreadAdvisoryCount (GetUnreadAdvisoryCountRequest) returns (GetUnreadAdvisoryCountResponse) {}

  // Config Schema Management (superuser)
  rpc GetGameConfigSchemas (GetGameConfigSchemasRequest) returns (GetGameConfigSchemasResponse) {}
  rpc UpdateGameConfigSchemas (UpdateGameConfigSchemasRequest) returns (UpdateGameConfigSchemasResponse) {}

  // Config File Editing
  rpc GetGameServerConfigFiles (GetGameServerConfigFilesRequest) returns (GetGameServerConfigFilesResponse) {}
  rpc GetGameServerConfigFile (GetGameServerConfigFileRequest) returns (GetGameServerConfigFileResponse) {}
  rpc UpdateGameServerConfigFile (UpdateGameServerConfigFileRequest) returns (UpdateGameServerConfigFileResponse) {}
  rpc GenerateGameServerConfigFile (GenerateGameServerConfigFileRequest) returns (GenerateGameServerConfigFileResponse) {}

  // Aggregated Views
  rpc ListAggregatedGameServers (ListAggregatedGameServersRequest) returns (ListAggregatedGameServersResponse) {}

  // Dashboard
  rpc GetNodeSystemInfo (GetNodeSystemInfoRequest) returns (GetNodeSystemInfoResponse) {}
  rpc GetNodeResourceSnapshot (GetNodeResourceSnapshotRequest) returns (GetNodeResourceSnapshotResponse) {}
  rpc GetDashboardOverview (GetDashboardOverviewRequest) returns (GetDashboardOverviewResponse) {}
  rpc GetNodeMetricsHistory (GetNodeMetricsHistoryRequest) returns (GetNodeMetricsHistoryResponse) {}
  rpc GetGameServerMetricsHistory (GetGameServerMetricsHistoryRequest) returns (GetGameServerMetricsHistoryResponse) {}

  // Mod management
  rpc SearchMods (SearchModsRequest) returns (SearchModsResponse) {}
  rpc GetModDetails (GetModDetailsRequest) returns (GetModDetailsResponse) {}
  rpc GetModVersions (GetModVersionsRequest) returns (GetModVersionsResponse) {}
  rpc InstallMod (InstallModRequest) returns (InstallModResponse) {}
  rpc UninstallMod (UninstallModRequest) returns (UninstallModResponse) {}
  rpc UpdateMod (UpdateModRequest) returns (UpdateModResponse) {}
  rpc ListInstalledMods (ListInstalledModsRequest) returns (ListInstalledModsResponse) {}
  rpc SetModAutoUpdate (SetModAutoUpdateRequest) returns (SetModAutoUpdateResponse) {}
  rpc SetModEnabled (SetModEnabledRequest) returns (SetModEnabledResponse) {}
  rpc PinModVersion (PinModVersionRequest) returns (PinModVersionResponse) {}

  rpc GetModCategories (GetModCategoriesRequest) returns (GetModCategoriesResponse) {}

  // Version tracking
  rpc GetVersionInfo (GetVersionInfoRequest) returns (GetVersionInfoResponse) {}
  rpc CheckForUpdate (CheckForUpdateRequest) returns (CheckForUpdateResponse) {}
  rpc SetDummyUpdateFailure (SetDummyUpdateFailureRequest) returns (SetDummyUpdateFailureResponse) {}

  // Node API keys
  rpc ListNodeApiKeys (ListNodeApiKeysRequest) returns (ListNodeApiKeysResponse) {}
  rpc SetNodeApiKey (SetNodeApiKeyRequest) returns (SetNodeApiKeyResponse) {}
  rpc DeleteNodeApiKey (DeleteNodeApiKeyRequest) returns (DeleteNodeApiKeyResponse) {}

  // Notification Channels
  rpc CreateNotificationChannel (CreateNotificationChannelRequest) returns (CreateNotificationChannelResponse) {}
  rpc UpdateNotificationChannel (UpdateNotificationChannelRequest) returns (UpdateNotificationChannelResponse) {}
  rpc DeleteNotificationChannel (DeleteNotificationChannelRequest) returns (DeleteNotificationChannelResponse) {}
  rpc ListNotificationChannels (ListNotificationChannelsRequest) returns (ListNotificationChannelsResponse) {}
  rpc TestNotificationChannel (TestNotificationChannelRequest) returns (TestNotificationChannelResponse) {}
  rpc GetLocalSMTPStatus (GetLocalSMTPStatusRequest) returns (GetLocalSMTPStatusResponse) {}

  // Alert Rules
  rpc CreateAlertRule (CreateAlertRuleRequest) returns (CreateAlertRuleResponse) {}
  rpc UpdateAlertRule (UpdateAlertRuleRequest) returns (UpdateAlertRuleResponse) {}
  rpc DeleteAlertRule (DeleteAlertRuleRequest) returns (DeleteAlertRuleResponse) {}
  rpc ListAlertRules (ListAlertRulesRequest) returns (ListAlertRulesResponse) {}

  // Alert History
  rpc GetAlertHistory (GetAlertHistoryRequest) returns (GetAlertHistoryResponse) {}

  // System SMTP (superuser only)
  rpc GetSystemSMTPConfig (GetSystemSMTPConfigRequest) returns (GetSystemSMTPConfigResponse) {}
  rpc SetSystemSMTPConfig (SetSystemSMTPConfigRequest) returns (SetSystemSMTPConfigResponse) {}
  rpc TestSystemSMTP (TestSystemSMTPRequest) returns (TestSystemSMTPResponse) {}

  // Scheduled Tasks
  rpc ListScheduledTasks (ListScheduledTasksRequest) returns (ListScheduledTasksResponse) {}
  rpc CreateScheduledTask (CreateScheduledTaskRequest) returns (CreateScheduledTaskResponse) {}
  rpc UpdateScheduledTask (UpdateScheduledTaskRequest) returns (UpdateScheduledTaskResponse) {}
  rpc DeleteScheduledTask (DeleteScheduledTaskRequest) returns (DeleteScheduledTaskResponse) {}
  rpc GetScheduledTaskLogs (GetScheduledTaskLogsRequest) returns (GetScheduledTaskLogsResponse) {}

  // Backups
  rpc GetGameServerBackupOverview (GetGameServerBackupOverviewRequest) returns (GetGameServerBackupOverviewResponse) {}
  rpc GetBackupSettings (GetBackupSettingsRequest) returns (GetBackupSettingsResponse) {}
  rpc UpdateBackupSettings (UpdateBackupSettingsRequest) returns (UpdateBackupSettingsResponse) {}
  rpc ListGameServerBackups (ListGameServerBackupsRequest) returns (ListGameServerBackupsResponse) {}
  rpc CreateGameServerBackup (CreateGameServerBackupRequest) returns (CreateGameServerBackupResponse) {}
  rpc DeleteGameServerBackup (DeleteGameServerBackupRequest) returns (DeleteGameServerBackupResponse) {}
  rpc RestoreGameServerBackup (RestoreGameServerBackupRequest) returns (RestoreGameServerBackupResponse) {}
}

message LoginRequest {
  string user_name = 1;
  string password = 2;
}

message LoginResponse {
  User user = 1;
}

message CreateUserRequest {
  string user_name = 1;
  string email = 2;
  string password = 3;
  string first_name = 4;
  string last_name = 5;
  bool super_user = 6;
}

message CreateUserResponse {
  User user = 1;
  optional Error error = 2;
}

message LogoutRequest {}

message LogoutResponse {}

message CheckUserAuthenticatedRequest {}

message CheckUserAuthenticatedResponse {
  bool authenticated = 1;
  User user = 2;
  repeated string permission_ids = 3;
}

message ListGameServersRequest {}

message ListGameServersResponse {
  repeated GameServer game_servers = 1;
}

message ListGamesRequest {}

message ListGamesResponse {
  repeated Game games = 1;
}

message GetGameRequest {
  string id = 1;
}

message GetGameResponse {
  Game game = 1;
}

message GetGameServerRequest {
  string id = 1;
}

message GetGameServerResponse {
  GameServer game_server = 1;
}

message User {
  string id = 1;
  string user_name = 2;
  string email = 3;
  string first_name = 4;
  string last_name = 5;
  bool super_user = 6;
  google.protobuf.Timestamp last_login = 7;
  google.protobuf.Timestamp created_at = 8;
}

message ListUsersRequest {}

message ListUsersResponse {
  repeated User users = 1;
}

message GetUserDetailsRequest {
  string id = 1;
}

message GetUserDetailsResponse {
  User user = 1;
}

message UpdateUserRequest {
  string id = 1;
  string user_name = 2;
  string email = 3;
  string first_name = 4;
  string last_name = 5;
  bool super_user = 6;
  string password = 7;
}

message UpdateUserResponse {
  User user = 1;
}

message DeleteUserRequest {
  string id = 1;
}

message DeleteUserResponse {}

enum NotificationEvent {
  SERVER_STARTED = 0;
  SERVER_STOPPED = 1;
  SERVER_UPDATING = 2;
  SERVER_FINISHED_UPDATE = 3;
  SERVER_INSTALLING = 4;
  SERVER_FINISHED_INSTALL = 5;
  MISCELLANEOUS = 6;
}

message NotificationStreamRequest {}

message NotificationStreamResponse {
  NotificationEvent event = 1;
  GameServer game_server = 2;
  string message = 3;
  string error = 4;
}

message GetUpdateTargetsRequest {
  string game_server_id = 1;
  string variant_id = 2;
}

message GetUpdateTargetsResponse {
  repeated UpdateTargetOption targets = 1;
  string current_target = 2;
}

message ListIPsRequest {}

message ListIPsResponse {
  repeated IP ips = 1;
}

message AddIPRequest {
  IP ip = 1;
}

message AddIPResponse {}

message RemoveIPRequest {
  IP ip = 1;
}

message RemoveIPResponse {}

message AddGameRequest {
  Game game = 1;
}

message AddGameResponse {
  Game game = 1;
  optional Error error = 2;
}

message EditGameRequest {
  string game_id = 1;
  Game game = 2;
}

message EditGameResponse {
  Game game = 1;
}

message UpdateGameStartArgsTemplateRequest {
  string game_id = 1;
  string platform = 2;
  string start_args_template = 3;
  string base_command = 4;
  bool allow_start_arg_editing = 5;
}

message UpdateGameStartArgsTemplateResponse {
  Game game = 1;
}

message UpdateGameStartArgBlocklistRequest {
  string game_id = 1;
  string start_arg_blocklist = 2;
}

message UpdateGameStartArgBlocklistResponse {
  Game game = 1;
}

message RemoveGameRequest {
  string game_id = 1;
}

message RemoveGameResponse {
}

message ImportGameRequest {
  string file_path = 1;
}

message ImportGameResponse {
  Game game = 1;
  optional Error error = 2;
}

message ExportGameRequest {
  string game_id = 1;
  string file_path = 2;
}

message ExportGameResponse {
  GameServer game_server = 1;
}

message UpdateGameServerRequest {
  string server_id = 1;
  string target = 2;
}
message UpdateGameServerResponse {}

message UpdateGameServerStartArgsRequest {
  string server_id = 1;
  string start_args_patches = 2;
}

message UpdateGameServerStartArgsResponse {
  GameServer game_server = 1;
}

message SetServerVariantRequest {
  string game_server_id = 1;
  string variant_id = 2;
  string target = 3;
  bool pin_target = 4;
}

message SetServerVariantResponse {
  GameServer game_server = 1;
  string status = 2;
  int32 installed_mod_count = 3;
}

message GetVariantOperationStatusRequest {
  string game_server_id = 1;
}

message GetVariantOperationStatusResponse {
  string status = 1;
  string error = 2;
  string variant_id = 3;
}

message ReinstallGameServerRequest {
  string server_id = 1;
}
message ReinstallGameServerResponse {
  GameServer game_server = 1;
}

message BackupGameServerRequest {
  string server_id = 1;
}
message BackupGameServerResponse {}

message QueryGameServerRequest {
  string server_id = 1;
}

message QueryGameServerResponse {
  ServerQuery query_info = 1;
}

message GetNodeRequest {
  string node_id = 1;
}

message GetNodeResponse {
  Node node = 1;
}

message ListNodesRequest {}

message ListNodesResponse {
  repeated Node nodes = 1;
}

message AddNodeRequest {
  Node node = 1;
}

message AddNodeResponse {
  Node node = 1;
}

message GenerateNodePairingObjectRequest {
  // Optional remote panel base URL this token is intended for.
  string target_url = 1;
}

message GenerateNodePairingObjectResponse {
  string base_url = 1;
  string pairing_token = 2;
  int64 mtls_port = 3;
}

message PairNodeRequest {
  // Remote node URL and pairing key generated on the remote panel.
  string remote_base_url = 1;
  string remote_secret_key = 2;
  // Remote node federation mTLS port used for peer RPCs.
  int64 remote_mtls_port = 8;

  // Public base URL for this panel so the remote panel can add us back.
  string local_base_url = 3;

  // Optional display names.
  string remote_name = 4;
  string local_name = 5;

  // Per-node TLS verification settings.
  bool remote_allow_insecure_tls = 6;
  bool local_allow_insecure_tls = 7;
}

message PairNodeResponse {
  // Node added locally.
  Node node = 1;

  // Result of adding this panel to the remote panel.
  bool reciprocal_added = 2;
  string reciprocal_error = 3;
  Node reciprocal_node = 4;
}

message RemoveNodeRequest {
  string node_id = 1;
}

message RemoveNodeResponse {
  Node node = 1;
}

message EditNodeRequest {
  Node node = 1;
}

message EditNodeResponse {
  Node node = 1;
}

message VerifyNodeRequest {
  string secret_key = 1;
}

message VerifyNodeResponse {
  Node node = 1;
}

message ListLocalSecretKeysRequest {
}

message ListLocalSecretKeysResponse {
  repeated SecretKey secret_keys = 1;
}

message CreateLocalSecretKeyRequest {
  string node_id = 1;
  string name = 2;
}

message CreateLocalSecretKeyResponse {
  int64 id = 1;
  string secret_key = 2;
  int64 mtls_port = 3;
}

message DeleteLocalSecretKeyRequest {
  int64 id = 1;
}

message DeleteLocalSecretKeyResponse {}

// RemoteServerSummary is a cached summary of a game server on a remote node.
message RemoteServerSummary {
  string id = 1;
  string source_node_id = 2;
  string node_id = 3;
  string remote_server_id = 4;
  string display_name = 5;
  Status status = 6;
  string game_name = 7;
  string game_id = 8;
  string ip_address = 9;
  int64 port = 10;
  int64 query_port = 11;
  int64 max_players = 12;
  int64 current_players = 13;
  string map_name = 14;
  string version = 15;
  string node_name = 16;
  string node_host = 17;
  google.protobuf.Timestamp last_remote_update = 18;
  google.protobuf.Timestamp last_synced_at = 19;
  bool is_stale = 20;
  VersionInfo version_info = 21;
}

// AggregatedGameServer represents either a local or remote server in the unified view.
message AggregatedGameServer {
  bool is_local = 1;
  // Set when is_local == true
  GameServer local_server = 2;
  // Set when is_local == false
  RemoteServerSummary remote_server = 3;
}

message SyncNodeRequest {
  string node_id = 1;
}

message SyncNodeResponse {
  bool success = 1;
  string error = 2;
}

message ListAggregatedGameServersRequest {}

message ListAggregatedGameServersResponse {
  repeated AggregatedGameServer servers = 1;
}

message ListRolesRequest {}

message ListRolesResponse {
  repeated Role roles = 1;
}

message Role {
  string id = 1;
  string name = 2;
  string description = 3;
  bool is_system = 4;
  repeated string permission_ids = 5;
}

message Permission {
  string id = 1;
  string name = 2;
  string description = 3;
}

message ListPermissionsRequest {}

message ListPermissionsResponse {
  repeated Permission permissions = 1;
}

message CreateRoleRequest {
  string name = 1;
  string description = 2;
  repeated string permission_ids = 3;
}

message CreateRoleResponse {
  Role role = 1;
}

message DeleteRoleRequest {
  string role_id = 1;
}

message DeleteRoleResponse {}

message ListGameServerAccessGrantsRequest {
  string game_server_id = 1;
}

message ListGameServerAccessGrantsResponse {
  repeated GameServerAccessGrant grants = 1;
}

message GameServerAccessGrant {
  string id = 1;
  string user_id = 2;
  string user_name = 3;
  string role_id = 4;
  string role_name = 5;
  string game_server_id = 6;
  string granted_by_user_id = 7;
  string granted_by_user_name = 8;
  google.protobuf.Timestamp created_at = 9;
}

message GrantGameServerAccessRequest {
  string game_server_id = 1;
  string user_id = 2;
  string role_id = 3;
}

message GrantGameServerAccessResponse {
  GameServerAccessGrant grant = 1;
}

message RevokeGameServerAccessRequest {
  string grant_id = 1;
  string game_server_id = 2;
}

message RevokeGameServerAccessResponse {}

message ListRemoteNodeUsersRequest {
  string node_id = 1;
  // Optional search filter. Super users can leave this empty to list all users.
  // Non-super users must provide a non-empty search term (matched against username or user ID).
  string search = 2;
}

message ListRemoteNodeUsersResponse {
  repeated RemoteUser users = 1;
}

message RemoteUser {
  string user_id = 1;
  string user_name = 2;
  string email = 3;
  string first_name = 4;
  string last_name = 5;
  string node_id = 6;
  string node_name = 7;
}

message ListFederatedAccessGrantsRequest {
  string game_server_id = 1;
}

message ListFederatedAccessGrantsResponse {
  repeated FederatedAccessGrantInfo grants = 1;
}

message FederatedAccessGrantInfo {
  string id = 1;
  string game_server_id = 2;
  string remote_node_id = 3;
  string remote_node_name = 4;
  string remote_user_id = 5;
  string remote_user_name = 6;
  string role_id = 7;
  string role_name = 8;
  string granted_by_user_id = 9;
  string granted_by_user_name = 10;
  google.protobuf.Timestamp created_at = 11;
}

message GrantFederatedAccessRequest {
  string game_server_id = 1;
  string remote_node_id = 2;
  string remote_user_id = 3;
  string remote_user_name = 4;
  string role_id = 5;
}

message GrantFederatedAccessResponse {
  FederatedAccessGrantInfo grant = 1;
}

message RevokeFederatedAccessRequest {
  string grant_id = 1;
  string game_server_id = 2;
}

message RevokeFederatedAccessResponse {}

// Dashboard messages

message GetNodeSystemInfoRequest {
  string node_id = 1;
}

message GetNodeSystemInfoResponse {
  NodeSystemInfo system_info = 1;
}

message GetNodeResourceSnapshotRequest {
  string node_id = 1;
}

message GetNodeResourceSnapshotResponse {
  NodeResourceSnapshot snapshot = 1;
}

message GetDashboardOverviewRequest {}

// DashboardNodeSummary combines node info with live resource snapshot.
message DashboardNodeSummary {
  Node node = 1;
  NodeSystemInfo system_info = 2;
  NodeResourceSnapshot snapshot = 3;
}

message GetDashboardOverviewResponse {
  repeated DashboardNodeSummary nodes = 1;
}

message GetNodeMetricsHistoryRequest {
  string node_id = 1;
  google.protobuf.Timestamp since = 2;
  google.protobuf.Timestamp until = 3;
}

message GetNodeMetricsHistoryResponse {
  repeated MetricsHistoryPoint points = 1;
}

message GetGameServerMetricsHistoryRequest {
  string game_server_id = 1;
  google.protobuf.Timestamp since = 2;
  google.protobuf.Timestamp until = 3;
}

message GetGameServerMetricsHistoryResponse {
  repeated GameServerMetricsHistoryPoint points = 1;
}

// Federation Mesh
message LeaveFederationRequest {}
message LeaveFederationResponse {}

message ListFederationAdvisoriesRequest {
  bool unread_only = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message FederationAdvisory {
  string id = 1;
  string type = 2;
  string title = 3;
  string message = 4;
  string source_node_id = 5;
  string source_node_name = 6;
  string subject_node_id = 7;
  string subject_node_name = 8;
  string subject_node_base_url = 9;
  bool read = 10;
  google.protobuf.Timestamp created_at = 11;
}

message ListFederationAdvisoriesResponse {
  repeated FederationAdvisory advisories = 1;
  int32 total_count = 2;
}

message MarkAdvisoriesReadRequest {
  repeated string advisory_ids = 1;
}
message MarkAdvisoriesReadResponse {}

message GetUnreadAdvisoryCountRequest {}
message GetUnreadAdvisoryCountResponse {
  int32 count = 1;
}

// Config Schema Messages

message ConfigFileInfo {
  string path = 1;
  string format = 2;
  string category = 3;
  int32 field_count = 4;
  int32 managed_field_count = 5;
  bool exists_on_disk = 6;
  bool generate_before_start = 7;
}

message ConfigFieldData {
  string key = 1;
  string value = 2;
  string title = 3;
  string description = 4;
  string field_type = 5;
  string default_value = 6;
  bool is_managed = 7;
  bool is_missing_from_file = 8;
  repeated string enum_options = 9;
  optional int64 minimum = 10;
  optional int64 maximum = 11;
  optional int32 max_length = 12;
  bool required = 13;
  bool allow_multiple = 14;
  repeated string values = 15;
  string group = 16;
  string managed_source = 17;
  repeated string enum_labels = 18;
  optional int32 order = 19;
}

message AdvancedField {
  string key = 1;
  string value = 2;
  string section = 3;
}

message ConfigValidationError {
  string field = 1;
  string message = 2;
}

message GetGameServerConfigFilesRequest {
  string game_server_id = 1;
}

message GetGameServerConfigFilesResponse {
  repeated ConfigFileInfo config_files = 1;
