syntax = "proto3";
import "google/protobuf/timestamp.proto";
import "xylona.proto";
import "shared.proto";

package xylona;
option go_package = 'github.com/ClintonCollins/Xylona/proto/go/xylona';

message GameServerConsoleOutput {
  string game_server_id = 1;
  string output = 2;
  // sequence monotonically identifies output from current nodes.
  uint64 sequence = 3;
  // reset_buffer instructs clients to replace, rather than append to, the buffer.
  bool reset_buffer = 4;
  // reconnecting is present only on controller connection-state messages:
  // true means retrying, false means the stream has reopened, and absent means
  // this payload contains ordinary node console data.
  optional bool reconnecting = 5;
}

message GameServerStatusUpdate {
  string game_server_id = 1;
  Status status = 2;
  string game_server_name = 3;
}

message GameServerVersionUpdate {
  string game_server_id = 1;
  string version = 2;
  VersionInfo version_info = 3;
}

message Request {
  enum Type {
    Unknown = 0;
    GetGameServerConsole = 1;
    GetGameServerStatus = 2;
    RemoveGameServerConsole = 3;
    RemoveGameServerStatus = 4;
    SubscribeServerMetrics = 5;
    UnsubscribeServerMetrics = 6;
  }
  optional string game_server_id = 1;
  Type type = 2;
}

message GameServerMetrics {
  double cpu_percent = 1;
  int64 memory_bytes = 2;
  int32 number_of_threads = 3;
  int64 disk_usage_bytes = 4;
  int64 uptime_seconds = 5;
  int64 memory_working_set_bytes = 6;
  double memory_percent = 7;
  int32 cpu_cores = 8;
  double io_read_rate = 9;
  double io_write_rate = 10;
  int32 connection_count = 11;
  bool cpu_valid = 12;
  bool metrics_valid = 13;
  int64 disk_total_bytes = 14;
  int64 disk_free_bytes = 15;
  double disk_percent = 16;
  bool disk_valid = 17;
  google.protobuf.Timestamp disk_measured_at = 18;
  google.protobuf.Timestamp collected_at = 19;
  bool io_valid = 20;
  bool connection_count_valid = 21;
  string process_status = 22;
  GameServerMetricsCollectionStatus collection_status = 23;
}

message AllServersMetrics {
  map<string, GameServerMetrics> servers = 1;
}

message AllNodeMetrics {
  map<string, NodeResourceSnapshot> nodes = 1;
}

message Message {
  enum Type {
    Unknown = 0;
    GameServerConsole = 1;
    GameServerStatus = 2;
    Raw = 3;
    ServerQueries = 4;
    GameServerMetrics = 5;
    NodeMetrics = 6;
    ServerSoftwareInstall = 7;
    GameServerUpdateProgress = 8;
    GameServerVersion = 9;
    GameServerBackupProgress = 10;
    SystemUpdateProgress = 11;
  }
  Type type = 1;
  optional GameServerConsoleOutput game_server_console_output = 2;
  optional GameServerStatusUpdate game_server_status_update = 3;
  string raw_data = 4;
  optional AllServersQueryInfo all_servers_query_info = 5;
  optional AllServersMetrics all_servers_metrics = 6;
  optional AllNodeMetrics all_node_metrics = 7;
  optional ServerSoftwareInstallUpdate server_software_install_update = 8;
  optional UpdateProgress update_progress = 9;
  optional GameServerVersionUpdate game_server_version_update = 10;
  optional BackupProgress backup_progress = 11;
  optional SystemUpdateProgress system_update_progress = 12;
}

message ServerSoftwareInstallUpdate {
  string game_server_id = 1;
  string status = 2;
  string error = 3;
  string software_id = 4;
  string game_server_name = 5;
}
