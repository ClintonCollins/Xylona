// node.proto defines the internal controller <-> node wire protocol. It is
// NOT a browser-facing surface — the Xylona controller is the sole client of
// this service. Each NodeService RPC maps 1:1 to a method on the
// internal/nodeclient.NodeClient interface.
syntax = "proto3";

package xylona.node.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/ClintonCollins/Xylona/proto/go/xylona/nodeproto/v1;nodeproto";

// NodeErrorCode is the typed error taxonomy surfaced by NodeService methods.
// Transport-layer errors (codes unavailable, deadline exceeded, etc.) remain
// the domain of Connect / gRPC; this enum carries node-specific sentinels.
enum NodeErrorCode {
  NODE_ERROR_UNSPECIFIED = 0;
  NODE_ERROR_INVALID_PATH = 1;
  NODE_ERROR_PROTECTED_PATH = 2;
  NODE_ERROR_PROCESS_NOT_FOUND = 3;
  NODE_ERROR_PROCESS_ALREADY_RUNNING = 4;
  NODE_ERROR_PROCESS_NOT_RUNNING = 5;
  NODE_ERROR_START_FAILED = 6;
  NODE_ERROR_FILE_NOT_FOUND = 7;
  NODE_ERROR_IO = 8;
  NODE_ERROR_PERMISSION = 9;
}

// ProcessStatus mirrors internal/node/supervisor/xylona.Status. Intentionally duplicated
// (rather than importing the public xylona.Status) so node.proto does not take
// a dependency on the browser-facing proto surface.
enum ProcessStatus {
  PROCESS_STATUS_UNKNOWN = 0;
  PROCESS_STATUS_OFFLINE = 1;
  PROCESS_STATUS_ONLINE = 2;
  PROCESS_STATUS_INSTALLING = 3;
  PROCESS_STATUS_UPDATING = 4;
  PROCESS_STATUS_PRE_START = 5;
}

// FileEntry mirrors internal/node.FileEntry.
message FileEntry {
  string name = 1;
  int64 size = 2;
  bool is_directory = 3;
  google.protobuf.Timestamp last_modified = 4;
  bool is_executable = 5;
}

// ProcessSnapshot mirrors internal/node.ProcessSnapshot.
message ProcessSnapshot {
  string id = 1;
  string name = 2;
  string status = 3;
  int64 unix_started_at = 4;
  double cpu_percent = 5;
  int32 cpu_cores = 6;
  uint64 memory_rss = 7;
  uint64 memory_vms = 8;
  float memory_percent = 9;
  int32 num_threads = 10;
  uint64 disk_usage_bytes = 11;
  double io_read_rate = 12;
  double io_write_rate = 13;
  int32 connection_count = 14;
  string working_dir = 15;
  // execution_id identifies the current or most recently completed process
  // execution. It changes every time the process ID is started again.
  string execution_id = 16;
  // previous_status and transition_sequence describe the latest authoritative
  // lifecycle transition retained by the node.
  string previous_status = 17;
  uint64 transition_sequence = 18;
  bool intentional_stop = 19;
  optional int32 exit_code = 20;
  uint64 disk_total_bytes = 21;
  uint64 disk_free_bytes = 22;
  double disk_percent = 23;
  google.protobuf.Timestamp disk_measured_at = 24;
  optional bool disk_valid = 25;
  optional bool cpu_valid = 26;
  optional bool metrics_valid = 27;
  optional bool io_valid = 28;
  optional bool connection_count_valid = 29;
}

// NodeSnapshot mirrors internal/node.NodeSnapshot.
message NodeSnapshot {
  string cpu_model = 1;
  int32 cpu_cores = 2;
  int32 cpu_threads = 3;
  uint64 total_memory = 4;
  string os = 5;
  string os_version = 6;
  string architecture = 7;
  string xylona_version = 8;

  double cpu_percent = 9;
  uint64 memory_used = 10;
  double memory_percent = 11;
  uint64 disk_used = 12;
  uint64 disk_total = 13;
  double disk_percent = 14;

  repeated ProcessSnapshot processes = 15;
  google.protobuf.Timestamp collected = 16;

  // default_install_path is the node-resolved root directory under which the
  // controller should create managed game-server directories. The node
  // computes it from its own OS + HOME/USERPROFILE env so hub-spoke
  // deployments don't incorrectly use the controller's paths.
  string default_install_path = 17;
}

message BindableIP {
  string address = 1;
  bool usable = 2;
  bool external = 3;
}

// ConsoleChunk is a slice of buffered console output for one process.
message ConsoleChunk {
  string game_server_id = 1;
  string text = 2;
  google.protobuf.Timestamp timestamp = 3;
  // sequence monotonically identifies console writes for the tracked process.
  // A reset chunk carries the latest sequence represented by its full buffer.
  uint64 sequence = 4;
  // reset_buffer tells consumers to replace their local console buffer with text.
  // It is used for atomic initial replay and reconnect recovery.
  bool reset_buffer = 5;
}

// ProcessStatusEvent fires when a supervised process changes lifecycle state.
message ProcessStatusEvent {
  string process_id = 1;
  string status = 2;
  string old_status = 3;
  bool intentional_stop = 4;
  optional int32 exit_code = 5;
  string execution_id = 6;
  uint64 transition_sequence = 7;
  bool replayed = 8;
}

// MetricsUpdateEvent fires when the node pushes a fresh metrics snapshot.
message MetricsUpdateEvent {
  NodeSnapshot snapshot = 1;
}

// ProcessCrashEvent fires when a supervised process exits unexpectedly.
message ProcessCrashEvent {
  string process_id = 1;
  string reason = 2;
  int32 exit_code = 3;
}

// Event is the union of events streamed by NodeService.StreamEvents. Exactly
// one payload field is set per message.
message Event {
  google.protobuf.Timestamp timestamp = 1;
  oneof payload {
    ProcessStatusEvent process_status = 2;
    ConsoleChunk console_output = 3;
    MetricsUpdateEvent metrics_update = 4;
    ProcessCrashEvent process_crash = 5;
  }
}

// --- Process RPCs -----------------------------------------------------------

message StartProcessRequest {
  string id = 1;
  string name = 2;
  string base_command = 3;
  repeated string args = 4;
  string working_directory = 5;
  string user = 6;
  string node_id = 7;
  string service_id = 8;
  int64 stop_timeout_seconds = 9;
  ProcessStatus initial_status = 10;
  // internal_command indicates the supervisor should run a built-in
  // installer/updater from internal/gameintegrations rather than exec a shell
  // command. When true, base_command/args are ignored and the supervisor
  // dispatches to the registered Game implementation identified by
  // internal_game_id.
  bool internal_command = 11;
  // internal_game_id identifies the built-in Game implementation to run
  // (e.g. "minecraft"). Only consulted when internal_command is true.
  string internal_game_id = 12;
  // launch_env is a secret-safe launch-only environment overlay. The node
  // appends it to the sanitized child environment immediately before process
  // start and must not expose it in snapshots, logs, or long-lived state.
  // Xylona avoids its own env leaks, but node host admins, process inspectors,
  // crash dumps, and the launched game/plugin can still read these values.
  map<string, string> launch_env = 13;
  // execution_id correlates lifecycle events and snapshots to this exact
  // invocation. Nodes generate one when older controllers omit it.
  string execution_id = 14;
  // telnet_input configures node-local telnet console input. The node always
  // dials localhost; no remote host is accepted over the wire.
  TelnetInput telnet_input = 15;
  RCONInput rcon_input = 16;
  RESTInput rest_input = 17;
}

message TelnetInput {
  int32 port = 1;
  string password = 2;
}

enum RCONProtocol {
  RCON_PROTOCOL_UNSPECIFIED = 0;
  RCON_PROTOCOL_SOURCE = 1;
  RCON_PROTOCOL_MINECRAFT = 2;
  RCON_PROTOCOL_RUST_WEB = 3;
}

message RCONInput {
  string host = 1;
  int32 port = 2;
  string password = 3;
  RCONProtocol protocol = 4;
}

enum RESTInputKind {
  REST_INPUT_KIND_UNSPECIFIED = 0;
  REST_INPUT_KIND_SATISFACTORY = 1;
}

message RESTInput {
  string host = 1;
  int32 port = 2;
  RESTInputKind kind = 3;
  string password = 4;
  repeated string previous_passwords = 5;
}

message StartProcessResponse {
  string process_id = 1;
}

message StopProcessRequest {
  string process_id = 1;
  string stop_input_command = 2;
}

message StopProcessResponse {}

message SendConsoleInputRequest {
  string process_id = 1;
  string input = 2;
}

message SendConsoleInputResponse {}

message ReadConsoleBufferRequest {
  string process_id = 1;
}

message ReadConsoleBufferResponse {
  ConsoleChunk chunk = 1;
}

message StreamConsoleOutputRequest {
  string process_id = 1;
  // replay_buffer atomically subscribes to live output and sends the retained
  // console buffer first as a reset chunk, eliminating snapshot/live gaps.
  bool replay_buffer = 2;
}

// --- File RPCs --------------------------------------------------------------

message ListFilesRequest {
  string directory = 1;
  string relative_path = 2;
}

message ListFilesResponse {
  repeated FileEntry entries = 1;
}

message ReadFileRequest {
  string directory = 1;
  string relative_path = 2;
}

message ReadFileResponse {
  bytes content = 1;
}

message StatFileRequest {
  string directory = 1;
  string relative_path = 2;
}

message StatFileResponse {
  FileEntry entry = 1;
}

message StreamFileRequest {
  string directory = 1;
  string relative_path = 2;
}

message StreamFileResponse {
  bytes content = 1;
}

// Write-path requests carry server_executable + base_command so the node can
// re-run the controller's IsProtectedServerPath check. Defense in depth: the
// controller also validates before dispatch, but we don't want the node to
// trust the controller blindly. When both fields are empty the node skips the
// protection check (non-game-server call sites).
message WriteFileRequest {
  string directory = 1;
  string relative_path = 2;
  bytes content = 3;
  string server_executable = 4;
  string base_command = 5;
}

message WriteFileResponse {}

message StreamWriteFileRequest {
  string directory = 1;
  string relative_path = 2;
  bytes content = 3;
  string server_executable = 4;
  string base_command = 5;
}

message StreamWriteFileResponse {
  int64 bytes_written = 1;
  string sha256 = 2;
}

message CopyFileOperation {
  string source_relative_path = 1;
  string destination_relative_path = 2;
}

message CopyFilesRequest {
  string directory = 1;
  repeated CopyFileOperation operations = 2;
  string server_executable = 3;
  string base_command = 4;
}

message CopyFilesResponse {
  repeated string copied = 1;
}

message CreateFileOrDirectoryRequest {
  string directory = 1;
  string relative_path = 2;
  string content = 3;
  bool is_directory = 4;
  string server_executable = 5;
  string base_command = 6;
}

message CreateFileOrDirectoryResponse {}

message DeleteFilesRequest {
  string directory = 1;
  repeated string files = 2;
  string server_executable = 3;
  string base_command = 4;
}

message DeleteFilesResponse {
  repeated string deleted = 1;
}

message RenameFileRequest {
  string directory = 1;
  string old_relative_path = 2;
  string new_relative_path = 3;
  string server_executable = 4;
  string base_command = 5;
}

message RenameFileResponse {
  string new_relative_path = 1;
}

message MoveFilesRequest {
  string directory = 1;
  repeated string files = 2;
  string destination = 3;
  string server_executable = 4;
  string base_command = 5;
}

message MoveFilesResponse {
  repeated string moved = 1;
}

message DownloadFileFromURLRequest {
  string directory = 1;
  string url = 2;
  string destination_directory_path = 3;
  string server_executable = 4;
  string base_command = 5;
  int64 expected_size = 6;
  string expected_sha256 = 7;
  string expected_sha1 = 8;
}

message DownloadFileFromURLResponse {
  string relative_path = 1;
  int64 bytes_written = 2;
  string sha256 = 3;
  string sha1 = 4;
  bool expected_match = 5;
}

enum FileArchiveCompression {
  FILE_ARCHIVE_COMPRESSION_ZIP = 0;
  FILE_ARCHIVE_COMPRESSION_BZIP2 = 1;
  FILE_ARCHIVE_COMPRESSION_GZIP = 2;
  FILE_ARCHIVE_COMPRESSION_ZST = 3;
  FILE_ARCHIVE_COMPRESSION_XZ = 4;
}

message CreateFileArchiveRequest {
  string directory = 1;
  string destination_archive_path = 2;
  repeated string include_paths = 3;
  FileArchiveCompression compression = 4;
  string server_executable = 5;
  string base_command = 6;
}

message CreateFileArchiveResponse {
  string relative_path = 1;
  int64 total_files = 2;
  int64 files_compressed = 3;
  int64 total_bytes = 4;
  int64 bytes_compressed = 5;
  string current_file = 6;
}

message ExtractFileArchiveRequest {
  string directory = 1;
  string archive_path = 2;
  string destination_directory_path = 3;
  string server_executable = 4;
  string base_command = 5;
}

message ExtractFileArchiveResponse {
  repeated string extracted_paths = 1;
  int64 total_files = 2;
  int64 files_extracted = 3;
  int64 total_bytes = 4;
  int64 bytes_extracted = 5;
  string current_file = 6;
}

// --- Backup RPCs ------------------------------------------------------------

// CreateBackupArchiveRequest asks the node to create a zip archive containing
// the selected include_paths (relative to directory). destination_archive_path
// is the absolute path on the node where the archive should be written.
message CreateBackupArchiveRequest {
  string directory = 1;
  repeated string include_paths = 2;
  string destination_archive_path = 3;
}

message CreateBackupArchiveResponse {
  int64 archive_bytes = 1;
  string archive_sha256 = 2;
}

// ExtractBackupArchive asks the node to extract archive_path into directory.
// overwrite_mode controls whether existing files are replaced or preserved:
// EXTRACT_MODE_OVERLAY preserves existing files outside the archive;
// EXTRACT_MODE_EXACT removes them before extraction. Symlinks in the archive
// are rejected.
message ExtractBackupArchiveRequest {
  string directory = 1;
  string archive_path = 2;
  ExtractMode mode = 3;
}

enum ExtractMode {
  EXTRACT_MODE_UNSPECIFIED = 0;
  EXTRACT_MODE_OVERLAY = 1;
  EXTRACT_MODE_EXACT = 2;
}

message ExtractBackupArchiveResponse {}

enum InstalledVersionProbeKind {
  INSTALLED_VERSION_PROBE_KIND_UNSPECIFIED = 0;
  INSTALLED_VERSION_PROBE_KIND_MINECRAFT_JAR = 1;
  INSTALLED_VERSION_PROBE_KIND_STEAM_MANIFEST = 2;
}

message ProbeInstalledVersionRequest {
  string directory = 1;
  InstalledVersionProbeKind kind = 2;
  repeated string relative_paths = 3;
  string preferred_steam_app_id = 4;
}

message ProbeInstalledVersionResponse {
  bool found = 1;
  string version = 2;
  string source_path = 3;
}

enum GameServerQueryKind {
  GAME_SERVER_QUERY_KIND_UNSPECIFIED = 0;
  GAME_SERVER_QUERY_KIND_MINECRAFT = 1;
  GAME_SERVER_QUERY_KIND_SOURCE = 2;
  GAME_SERVER_QUERY_KIND_PALWORLD = 3;
  GAME_SERVER_QUERY_KIND_SEVEN_DAYS_TO_DIE = 4;
  GAME_SERVER_QUERY_KIND_FACTORIO = 5;
  GAME_SERVER_QUERY_KIND_HYTALE = 6;
  GAME_SERVER_QUERY_KIND_PROJECT_ZOMBOID = 7;
  GAME_SERVER_QUERY_KIND_TERRARIA = 8;
  GAME_SERVER_QUERY_KIND_SOURCE_RCON = 9;
  GAME_SERVER_QUERY_KIND_RUST = 10;
}

message QueryGameServerRequest {
  GameServerQueryKind kind = 1;
  string ip = 2;
  int64 query_port = 3;
  int64 max_players = 4;
  string username = 5;
  string password = 6;
}

message GameServerMinecraftQueryInfo {
  string motd = 1;
  string game_type = 2;
  string map = 3;
  uint32 number_of_players = 4;
  uint32 max_players = 5;
  repeated string player_list = 6;
  uint32 protocol_version = 7;
  string server_version = 8;
  repeated GameServerPlayer player_details = 9;
}

message GameServerSourceQueryInfo {
  string name = 1;
  string map = 2;
  string game = 3;
  uint32 app_id = 4;
  uint64 steam_id = 5;
  uint64 game_id = 6;
  uint32 players = 7;
  uint32 max_players = 8;
  uint32 bots = 9;
  string server_os = 10;
  bool visibility = 11;
  bool vac = 12;
  string version = 13;
  uint32 protocol = 14;
  repeated string player_list = 15;
  bool player_list_supported = 16;
}

message GameServerPalworldQueryInfo {
  string name = 1;
  string description = 2;
  string version = 3;
  string world_guid = 4;
  uint32 players = 5;
  uint32 max_players = 6;
  repeated string player_list = 7;
  uint64 uptime_seconds = 8;
  double server_fps = 9;
  double server_frame_time_ms = 10;
  uint32 days = 11;
  bool responded = 12;
  repeated GameServerPlayer player_details = 13;
}

message QueryGameServerResponse {
  GameServerQueryKind kind = 1;
  GameServerMinecraftQueryInfo minecraft = 2;
  GameServerSourceQueryInfo source = 3;
  GameServerPalworldQueryInfo palworld = 4;
}

// --- Process console output (controller-generated lines) --------------------

// SendConsoleOutput writes a controller-generated line into the process's
// console buffer. Used for pre-start messages, mod auto-update progress,
// variant-change notifications, etc. — anything the controller wants to
// show in the console for that game server regardless of whether the
// underlying process is running.
message SendConsoleOutputRequest {
  string process_id = 1;
  string line = 2;
}

message SendConsoleOutputResponse {}

// GetProcessSnapshotRequest fetches the metrics + status for one process.
// Equivalent to filtering GetNodeSnapshot's Processes list by ID but cheaper
// when the caller only cares about one server.
message GetProcessSnapshotRequest {
  string process_id = 1;
}

message GetProcessSnapshotResponse {
  ProcessSnapshot snapshot = 1;
  bool found = 2;
}

// --- Node RPCs --------------------------------------------------------------

message GetNodeSnapshotRequest {}

message ListBindableIPsRequest {}

message ListBindableIPsResponse {
  repeated BindableIP ips = 1;
}

message StreamEventsRequest {
  // replay_process_status asks the node to atomically replay the retained
  // latest lifecycle transition for every process before live delivery.
  bool replay_process_status = 1;
}

message PingRequest {}

message PingResponse {
  google.protobuf.Timestamp server_time = 1;
}

message GetRuntimeCapabilitiesRequest {}

message GetRuntimeCapabilitiesResponse {
  int64 protocol_version = 1;
  bool launch_env = 2;
  bool reliable_process_lifecycle = 3;
  bool telnet_input = 4;
  bool player_actions = 5;
  bool rcon_input = 6;
  bool rest_input = 7;
}

// --- Self-update RPCs -------------------------------------------------------

message GetUpdateCapabilitiesRequest {}

message GetUpdateCapabilitiesResponse {
  bool supported = 1;
  string reason = 2;
  string component = 3;
  string current_version = 4;
  string os = 5;
  string architecture = 6;
  int64 protocol_version = 7;
  bool service_manager_supported = 8;
  bool install_path_writable = 9;
  string install_path = 10;
}

message StageSelfUpdateRequest {
  string component = 1;
  string target_version = 2;
  string os = 3;
  string architecture = 4;
  int64 expected_size = 5;
  string expected_sha256 = 6;
  bytes content = 7;
}

message StageSelfUpdateResponse {
  string stage_id = 1;
  int64 bytes_written = 2;
  string sha256 = 3;
}

message ApplySelfUpdateRequest {
  string stage_id = 1;
  string target_version = 2;
  string expected_sha256 = 3;
}

message ApplySelfUpdateResponse {
  bool accepted = 1;
  string message = 2;
}

// NodeService is the controller <-> node internal wire protocol. All methods
// require an "Authorization: Bearer <shared_secret>" header; TLS layer handles
// cert-fingerprint pinning.
service NodeService {
  // Process lifecycle
  rpc StartProcess(StartProcessRequest) returns (StartProcessResponse);
  rpc StopProcess(StopProcessRequest) returns (StopProcessResponse);
  rpc SendConsoleInput(SendConsoleInputRequest) returns (SendConsoleInputResponse);
  rpc ReadConsoleBuffer(ReadConsoleBufferRequest) returns (ReadConsoleBufferResponse);
  rpc StreamConsoleOutput(StreamConsoleOutputRequest) returns (stream ConsoleChunk);

  // File operations
  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse);
  rpc ReadFile(ReadFileRequest) returns (ReadFileResponse);
  rpc StatFile(StatFileRequest) returns (StatFileResponse);
  rpc StreamFile(StreamFileRequest) returns (stream StreamFileResponse);
  rpc WriteFile(WriteFileRequest) returns (WriteFileResponse);
  rpc StreamWriteFile(stream StreamWriteFileRequest) returns (StreamWriteFileResponse);
  rpc CreateFileOrDirectory(CreateFileOrDirectoryRequest) returns (CreateFileOrDirectoryResponse);
  rpc DeleteFiles(DeleteFilesRequest) returns (DeleteFilesResponse);
  rpc RenameFile(RenameFileRequest) returns (RenameFileResponse);
  rpc MoveFiles(MoveFilesRequest) returns (MoveFilesResponse);
  rpc CopyFiles(CopyFilesRequest) returns (CopyFilesResponse);
  rpc DownloadFileFromURL(DownloadFileFromURLRequest) returns (DownloadFileFromURLResponse);
  rpc CreateFileArchive(CreateFileArchiveRequest) returns (CreateFileArchiveResponse);
  rpc StreamCreateFileArchive(CreateFileArchiveRequest) returns (stream CreateFileArchiveResponse);
  rpc ExtractFileArchive(ExtractFileArchiveRequest) returns (ExtractFileArchiveResponse);
  rpc StreamExtractFileArchive(ExtractFileArchiveRequest) returns (stream ExtractFileArchiveResponse);

  // Backup operations
  rpc CreateBackupArchive(CreateBackupArchiveRequest) returns (CreateBackupArchiveResponse);
  rpc ExtractBackupArchive(ExtractBackupArchiveRequest) returns (ExtractBackupArchiveResponse);
  rpc ProbeInstalledVersion(ProbeInstalledVersionRequest) returns (ProbeInstalledVersionResponse);
  rpc QueryGameServer(QueryGameServerRequest) returns (QueryGameServerResponse);
  rpc PerformGameServerPlayerAction(PerformGameServerPlayerActionRequest) returns (PerformGameServerPlayerActionResponse);

  // Console output (controller-generated lines pushed into the process buffer)
  rpc SendConsoleOutput(SendConsoleOutputRequest) returns (SendConsoleOutputResponse);

  // Process introspection
  rpc GetProcessSnapshot(GetProcessSnapshotRequest) returns (GetProcessSnapshotResponse);

  // Node introspection
  rpc ListBindableIPs(ListBindableIPsRequest) returns (ListBindableIPsResponse);
  rpc GetNodeSnapshot(GetNodeSnapshotRequest) returns (NodeSnapshot);
  rpc GetRuntimeCapabilities(GetRuntimeCapabilitiesRequest) returns (GetRuntimeCapabilitiesResponse);
  rpc StreamEvents(StreamEventsRequest) returns (stream Event);
  rpc Ping(PingRequest) returns (PingResponse);

  // Self-update
  rpc GetUpdateCapabilities(GetUpdateCapabilitiesRequest) returns (GetUpdateCapabilitiesResponse);
  rpc StageSelfUpdate(stream StageSelfUpdateRequest) returns (StageSelfUpdateResponse);
  rpc ApplySelfUpdate(ApplySelfUpdateRequest) returns (ApplySelfUpdateResponse);
}

message GameServerPlayer {
  string name = 1;
  string id = 2;
}

enum GameServerPlayerAction {
  GAME_SERVER_PLAYER_ACTION_UNSPECIFIED = 0;
  GAME_SERVER_PLAYER_ACTION_KICK = 1;
  GAME_SERVER_PLAYER_ACTION_BAN = 2;
  GAME_SERVER_PLAYER_ACTION_UNBAN = 3;
  GAME_SERVER_PLAYER_ACTION_ALLOWLIST_ADD = 4;
  GAME_SERVER_PLAYER_ACTION_ALLOWLIST_REMOVE = 5;
}

message PerformGameServerPlayerActionRequest {
  GameServerQueryKind kind = 1;
  GameServerPlayerAction action = 2;
  string process_id = 3;
  string ip = 4;
  int64 query_port = 5;
  string username = 6;
  string password = 7;
  string player_id = 8;
  string reason = 9;
}

message PerformGameServerPlayerActionResponse {}
