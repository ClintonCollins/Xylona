// NodeService is the controller <-> node internal wire protocol. All methods
// require an "Authorization: Bearer <shared_secret>" header; TLS layer handles
// cert-fingerprint pinning.
service NodeService {
  // Process lifecycle
  rpc StartProcess(StartProcessRequest) returns (StartProcessResponse);
  rpc StopProcess(StopProcessRequest) returns (StopProcessResponse);
  rpc SendConsoleInput(SendConsoleInputRequest) returns (SendConsoleInputResponse);
  rpc ReadConsoleBuffer(ReadConsoleBufferRequest) returns (ReadConsoleBufferResponse);
  rpc StreamConsoleOutput(StreamConsoleOutputRequest) returns (stream ConsoleChunk);

  // File operations
  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse);
  rpc ReadFile(ReadFileRequest) returns (ReadFileResponse);
  rpc StatFile(StatFileRequest) returns (StatFileResponse);
  rpc StreamFile(StreamFileRequest) returns (stream StreamFileResponse);
  rpc WriteFile(WriteFileRequest) returns (WriteFileResponse);
  rpc StreamWriteFile(stream StreamWriteFileRequest) returns (StreamWriteFileResponse);
  rpc CreateFileOrDirectory(CreateFileOrDirectoryRequest) returns (CreateFileOrDirectoryResponse);
  rpc DeleteFiles(DeleteFilesRequest) returns (DeleteFilesResponse);
  rpc RenameFile(RenameFileRequest) returns (RenameFileResponse);
  rpc MoveFiles(MoveFilesRequest) returns (MoveFilesResponse);
  rpc CopyFiles(CopyFilesRequest) returns (CopyFilesResponse);
  rpc DownloadFileFromURL(DownloadFileFromURLRequest) returns (DownloadFileFromURLResponse);
  rpc CreateFileArchive(CreateFileArchiveRequest) returns (CreateFileArchiveResponse);
  rpc StreamCreateFileArchive(CreateFileArchiveRequest) returns (stream CreateFileArchiveResponse);
  rpc ExtractFileArchive(ExtractFileArchiveRequest) returns (ExtractFileArchiveResponse);
  rpc StreamExtractFileArchive(ExtractFileArchiveRequest) returns (stream ExtractFileArchiveResponse);

  // Backup operations
  rpc CreateBackupArchive(CreateBackupArchiveRequest) returns (CreateBackupArchiveResponse);
  rpc ExtractBackupArchive(ExtractBackupArchiveRequest) returns (ExtractBackupArchiveResponse);
  rpc ProbeInstalledVersion(ProbeInstalledVersionRequest) returns (ProbeInstalledVersionResponse);
  rpc QueryGameServer(QueryGameServerRequest) returns (QueryGameServerResponse);
  rpc QueryPalworldMap(QueryPalworldMapRequest) returns (QueryPalworldMapResponse);
  rpc QuerySevenDaysToDieMap(QuerySevenDaysToDieMapRequest) returns (QuerySevenDaysToDieMapResponse);
  rpc QuerySevenDaysToDieWebAPIStatus(QuerySevenDaysToDieWebAPIStatusRequest) returns (QuerySevenDaysToDieWebAPIStatusResponse);
  rpc QuerySevenDaysToDieOperationMetadata(QuerySevenDaysToDieOperationMetadataRequest) returns (QuerySevenDaysToDieOperationMetadataResponse);
  rpc QuerySevenDaysToDiePlayers(QuerySevenDaysToDiePlayersRequest) returns (QuerySevenDaysToDiePlayersResponse);
  rpc QuerySevenDaysToDieReportedMods(QuerySevenDaysToDieReportedModsRequest) returns (QuerySevenDaysToDieReportedModsResponse);
  rpc QuerySevenDaysToDieSandboxSettings(QuerySevenDaysToDieSandboxSettingsRequest) returns (QuerySevenDaysToDieSandboxSettingsResponse);
  rpc GetSevenDaysToDieMapTile(GetSevenDaysToDieMapTileRequest) returns (GetSevenDaysToDieMapTileResponse);
  rpc EnsureMinecraftMap(EnsureMinecraftMapRequest) returns (EnsureMinecraftMapResponse);
  rpc StopMinecraftMap(StopMinecraftMapRequest) returns (StopMinecraftMapResponse);
  rpc GetMinecraftMapAsset(GetMinecraftMapAssetRequest) returns (GetMinecraftMapAssetResponse);
  rpc PerformGameServerPlayerAction(PerformGameServerPlayerActionRequest) returns (PerformGameServerPlayerActionResponse);
  rpc ExecuteGameOperation(ExecuteGameOperationRequest) returns (ExecuteGameOperationResponse);

  // Console output (controller-generated lines pushed into the process buffer)
  rpc SendConsoleOutput(SendConsoleOutputRequest) returns (SendConsoleOutputResponse);

  // Process introspection
  rpc GetProcessSnapshot(GetProcessSnapshotRequest) returns (GetProcessSnapshotResponse);

  // Node introspection
  rpc ListBindableIPs(ListBindableIPsRequest) returns (ListBindableIPsResponse);
  rpc GetNodeSnapshot(GetNodeSnapshotRequest) returns (NodeSnapshot);
  rpc GetRuntimeCapabilities(GetRuntimeCapabilitiesRequest) returns (GetRuntimeCapabilitiesResponse);
  rpc StreamEvents(StreamEventsRequest) returns (stream Event);
  rpc Ping(PingRequest) returns (PingResponse);

  // Self-update
  rpc GetUpdateCapabilities(GetUpdateCapabilitiesRequest) returns (GetUpdateCapabilitiesResponse);
  rpc StageSelfUpdate(stream StageSelfUpdateRequest) returns (StageSelfUpdateResponse);
  rpc ApplySelfUpdate(ApplySelfUpdateRequest) returns (ApplySelfUpdateResponse);
}

message GameServerPlayer {
  string name = 1;
  string id = 2;
}

enum GameServerPlayerAction {
  GAME_SERVER_PLAYER_ACTION_UNSPECIFIED = 0;
  GAME_SERVER_PLAYER_ACTION_KICK = 1;
  GAME_SERVER_PLAYER_ACTION_BAN = 2;
  GAME_SERVER_PLAYER_ACTION_UNBAN = 3;
  GAME_SERVER_PLAYER_ACTION_ALLOWLIST_ADD = 4;
  GAME_SERVER_PLAYER_ACTION_ALLOWLIST_REMOVE = 5;
}

message PerformGameServerPlayerActionRequest {
  GameServerQueryKind kind = 1;
  GameServerPlayerAction action = 2;
  string process_id = 3;
  string ip = 4;
  int64 query_port = 5;
  string username = 6;
  string password = 7;
  string player_id = 8;
  string reason = 9;
}

message PerformGameServerPlayerActionResponse {}

message GameOperationValue {
  string field_id = 1;
  oneof value {
    string string_value = 2;
    int64 integer_value = 3;
    bool boolean_value = 4;
  }
}

enum GameOperationResultClassification {
  GAME_OPERATION_RESULT_CLASSIFICATION_UNSPECIFIED = 0;
  GAME_OPERATION_RESULT_CLASSIFICATION_CONFIRMED = 1;
  GAME_OPERATION_RESULT_CLASSIFICATION_ACCEPTED_BUT_UNVERIFIED = 2;
  GAME_OPERATION_RESULT_CLASSIFICATION_FAILED = 3;
}

message GameOperationTransportDetails {
  string method = 1;
  string verification = 2;
}

message ExecuteGameOperationRequest {
  string working_directory = 1;
  string token_name = 2;
  string token_secret = 3;
  string operation_id = 4;
  repeated GameOperationValue values = 5;
}

message ExecuteGameOperationResponse {
  GameOperationResultClassification classification = 1;
  string message = 2;
  GameOperationTransportDetails transport_details = 3;
}

message PalworldMapHealth {
  double server_fps = 1;
  double server_frame_time_ms = 2;
  uint32 current_players = 3;
  uint32 max_players = 4;
  uint64 uptime_seconds = 5;
  uint32 base_camp_count = 6;
  uint32 days = 7;
}

enum SevenDaysToDieWebAPIConnectionState {
  SEVEN_DAYS_TO_DIE_WEB_API_CONNECTION_STATE_UNSPECIFIED = 0;
  SEVEN_DAYS_TO_DIE_WEB_API_CONNECTION_STATE_AVAILABLE = 1;
  SEVEN_DAYS_TO_DIE_WEB_API_CONNECTION_STATE_SERVER_OFFLINE = 2;
  SEVEN_DAYS_TO_DIE_WEB_API_CONNECTION_STATE_DASHBOARD_DISABLED = 3;
  SEVEN_DAYS_TO_DIE_WEB_API_CONNECTION_STATE_MISCONFIGURED = 4;
  SEVEN_DAYS_TO_DIE_WEB_API_CONNECTION_STATE_NODE_UNAVAILABLE = 5;
  SEVEN_DAYS_TO_DIE_WEB_API_CONNECTION_STATE_WEB_API_UNREACHABLE = 6;
  SEVEN_DAYS_TO_DIE_WEB_API_CONNECTION_STATE_DISCOVERY_UNSUPPORTED = 7;
  SEVEN_DAYS_TO_DIE_WEB_API_CONNECTION_STATE_AUTHENTICATION_DENIED = 8;
  SEVEN_DAYS_TO_DIE_WEB_API_CONNECTION_STATE_INVALID_RESPONSE = 9;
}

enum SevenDaysToDieWebAPIValueState {
  SEVEN_DAYS_TO_DIE_WEB_API_VALUE_STATE_UNSPECIFIED = 0;
  SEVEN_DAYS_TO_DIE_WEB_API_VALUE_STATE_AVAILABLE = 1;
  SEVEN_DAYS_TO_DIE_WEB_API_VALUE_STATE_UNSUPPORTED = 2;
  SEVEN_DAYS_TO_DIE_WEB_API_VALUE_STATE_PERMISSION_DENIED = 3;
  SEVEN_DAYS_TO_DIE_WEB_API_VALUE_STATE_UNAVAILABLE = 4;
}

message SevenDaysToDieGameTime {
  int32 day = 1;
  int32 hour = 2;
  int32 minute = 3;
}

message SevenDaysToDieWebAPICapabilities {
  bool player_data = 1;
  bool runtime_settings = 2;
  bool native_log = 3;
  bool world_population = 4;
  bool hostile_and_animal_positions = 5;
  bool access_control = 6;
  bool game_permissions = 7;
  bool reported_mods = 8;
  bool hostile_positions = 9;
  bool animal_positions = 10;
  bool command_execution = 11;
  bool command_permissions = 12;
}

message SevenDaysToDieWebAPIStatus {
  SevenDaysToDieWebAPIConnectionState connection_state = 1;
  string api_version = 2;
  SevenDaysToDieWebAPICapabilities capabilities = 3;
  SevenDaysToDieWebAPIValueState world_time_state = 4;
  SevenDaysToDieGameTime world_time = 5;
  SevenDaysToDieWebAPIValueState blood_moon_state = 6;
  optional bool blood_moon_active = 7;
  SevenDaysToDieGameTime next_blood_moon = 8;
  SevenDaysToDieGameTime next_blood_moon_end = 9;
  google.protobuf.Timestamp observed_at = 10;
  SevenDaysToDieWebAPIValueState command_operations_state = 11;
  repeated string allowed_game_operations = 12;
  repeated string supported_game_operations = 13;
  repeated string known_commands = 14;
}

message QuerySevenDaysToDieWebAPIStatusRequest {
  string working_directory = 1;
  string token_name = 2;
  string token_secret = 3;
  bool include_tactical = 4;
}

message QuerySevenDaysToDieWebAPIStatusResponse {
  SevenDaysToDieWebAPIStatus status = 1;
}

message SevenDaysToDieOperationOption {
  string label = 1;
  string value = 2;
  string description = 3;
  string icon_name = 4;
  string category = 5;
  string accent_color = 6;
}

message SevenDaysToDieOperationMetadata {
  repeated SevenDaysToDieOperationOption players = 1;
  repeated SevenDaysToDieOperationOption items = 2;
  repeated SevenDaysToDieOperationOption buffs = 3;
  repeated SevenDaysToDieOperationOption commands = 4;
}

message QuerySevenDaysToDieOperationMetadataRequest {
  string working_directory = 1;
}

message QuerySevenDaysToDieOperationMetadataResponse {
  SevenDaysToDieOperationMetadata result = 1;
}

message SevenDaysToDiePlayer {
  string name = 1;
  string action_id = 2;
  string entity_id = 3;
  string platform_id = 4;
  string cross_platform_id = 5;
  optional bool online = 6;
  optional int32 ping = 7;
  optional int32 level = 8;
  optional int32 health = 9;
  optional float stamina = 10;
  optional int32 score = 11;
  optional int32 deaths = 12;
  optional int32 zombie_kills = 13;
  optional int32 player_kills = 14;
  optional bool banned = 15;
}

message SevenDaysToDiePlayers {
  SevenDaysToDieWebAPIConnectionState connection_state = 1;
  SevenDaysToDieWebAPIValueState state = 2;
  repeated SevenDaysToDiePlayer players = 3;
}

message QuerySevenDaysToDiePlayersRequest {
  string working_directory = 1;
  string token_name = 2;
  string token_secret = 3;
}

message QuerySevenDaysToDiePlayersResponse {
  SevenDaysToDiePlayers result = 1;
}

message SevenDaysToDieReportedMod {
  string name = 1;
  string display_name = 2;
  string description = 3;
  string author = 4;
  string version = 5;
}

message SevenDaysToDieReportedMods {
  SevenDaysToDieWebAPIConnectionState connection_state = 1;
  SevenDaysToDieWebAPIValueState state = 2;
  repeated SevenDaysToDieReportedMod mods = 3;
}

message QuerySevenDaysToDieReportedModsRequest {
  string working_directory = 1;
  string token_name = 2;
  string token_secret = 3;
}

message QuerySevenDaysToDieReportedModsResponse {
