}

enum SevenDaysToDieSandboxComparisonState {
  SEVEN_DAYS_TO_DIE_SANDBOX_COMPARISON_STATE_UNSPECIFIED = 0;
  SEVEN_DAYS_TO_DIE_SANDBOX_COMPARISON_STATE_MATCH = 1;
  SEVEN_DAYS_TO_DIE_SANDBOX_COMPARISON_STATE_MISMATCH = 2;
  SEVEN_DAYS_TO_DIE_SANDBOX_COMPARISON_STATE_STALE = 3;
}

message SevenDaysToDieSandboxSetting {
  string key = 1;
  string label = 2;
  string description = 3;
  string group = 4;
  reserved 5, 6, 9;
  string effective_value = 7;
  string effective_label = 8;
}

message SevenDaysToDieSandboxSettings {
  SevenDaysToDieWebAPIConnectionState connection_state = 1;
  SevenDaysToDieWebAPIValueState state = 2;
  SevenDaysToDieSandboxComparisonState comparison_state = 3;
  string configured_code = 4;
  string effective_code = 5;
  repeated SevenDaysToDieSandboxSetting settings = 6;
  google.protobuf.Timestamp observed_at = 7;
}

message QuerySevenDaysToDieSandboxSettingsRequest {
  string working_directory = 1;
  string token_name = 2;
  string token_secret = 3;
}

message QuerySevenDaysToDieSandboxSettingsResponse {
  SevenDaysToDieSandboxSettings result = 1;
}
