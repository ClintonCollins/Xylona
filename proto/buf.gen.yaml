version: v2
clean: true
plugins:
  - local: protoc-gen-connect-go
    out: go/xylona
    opt:
      - paths=source_relative
  - local: protoc-gen-go
    out: go/xylona
    opt:
      - paths=source_relative
  - local: ../frontend/node_modules/.bin/protoc-gen-es
    out: ../frontend/src/proto
    include_imports: true
    opt:
      - target=ts
