syntax = "proto3";
import "google/protobuf/timestamp.proto";
import "gameserver_files_operations.proto";
// import "games/minecraft.proto";

package xylona;
option go_package = 'github.com/ClintonCollins/Xylona/proto/go/xylona';

enum Error {
  BAD_REQUEST = 0;
  PORT_IN_USE = 1;
  GAME_SERVER_ALREADY_EXISTS = 2;
  USER_ALREADY_EXISTS = 3;
}

message GameServerFilesArchiveProgress {
  int64 total_files = 1;
  int64 files_compressed = 2;
  int64 total_bytes = 3;
  int64 bytes_compressed = 4;
  string current_file = 5;
}

message GameServerFilesExtractProgress {
  int64 total_files = 1;
  int64 files_extracted = 2;
  int64 total_bytes = 3;
  int64 bytes_extracted = 4;
  string current_file = 5;
}

enum CommandProcessor {
  DIRECT = 0;
  XYLONA_INTERNAL = 1;
  BASH = 2;
  CMD = 3;
  POWERSHELL = 4;
}

message Game {
  string id = 1;
  string name = 2;
  int64 default_port = 3;
  int64 default_query_port = 4;
  int64 default_max_players = 5;
  bool linux_support = 6;
  bool windows_support = 7;
  string linux_start_command = 8;
  string linux_stop_command = 9;
  string linux_install_command = 10;
  string linux_update_command = 11;
  string linux_working_directory = 12;
  reserved 13;
  reserved "linux_configuration_file_paths";
  bool linux_allow_backups = 14;
  string windows_start_command = 15;
  string windows_stop_command = 16;
  string windows_install_command = 17;
  string windows_update_command = 18;
  string windows_working_directory = 19;
  reserved 20;
  reserved "windows_configuration_file_paths";
  bool windows_allow_backups = 21;
  bool require_dedicated_ip = 22;
  bool binds_to_all_ips = 23;
  google.protobuf.Timestamp created_at = 24;
  google.protobuf.Timestamp updated_at = 25;
  bool uses_source_query = 26;
  bool requires_steam_game_server_login_token = 27;
  CommandProcessor linux_install_command_processor = 28;
  CommandProcessor linux_update_command_processor = 29;
  CommandProcessor windows_install_command_processor = 30;
  CommandProcessor windows_update_command_processor = 31;
  bool uses_steamcmd = 32;
  string steam_appid = 33;
  string config_schemas = 70; // JSON blob, parsed by application layer
  string server_software = 71; // JSON blob, parsed by application layer
}

message SteamApp {
  string app_id = 1;
  string name = 2;
}

message SteamAppDetails {
  string app_id = 1;
  string name = 2;
  bool windows_support = 3;
  bool linux_support = 4;
  string install_directory = 5;
  string parent_app_id = 6;
  repeated SteamLaunchConfig launch_configs = 7;
}

message SteamLaunchConfig {
  string executable = 1;
  string arguments = 2;
  string os = 3;
  string description = 4;
}

enum Status {
  UNKNOWN = 0;
  OFFLINE = 1;
  ONLINE = 2;
  INSTALLING = 3;
  UPDATING = 4;
  PRE_START = 5;
}

message GameServerPlayer {
  string name = 1;
  optional string id = 2;
  optional string steam_id = 3;
}

message SteamBranch {
  string name = 1;
  string build_id = 2;
  string description = 3;
  string time_updated = 4;
}

message GameServer {
  string id = 1;
  string user_id = 2;
  string name = 3;
  string game_id = 4;
  string start_command = 5;
  Status status = 6;
  int64 set_max_players = 7;
  int64 max_players = 8;
  string map = 9;
  IP ip = 10;
  int64 port = 11;
  int64 query_port = 12;
  string directory = 13;
  int64 max_memory_mb = 14;
  bool backups_enabled = 15;
  string backup_directory = 16;
  int64 max_backups = 17;
  google.protobuf.Timestamp created_at = 18;
  google.protobuf.Timestamp updated_at = 19;
  string steam_game_server_login_token = 20;
  string user_name = 21;
  string game_name = 22;
  int64 cpu_percent = 23;
  int64 memory_bytes = 24;
  int64 number_of_threads = 25;
  string version = 26;
  int64 current_player_count = 27;
  repeated GameServerPlayer current_players = 28;
  SteamBranch steam_branch = 29;
  string branch = 30;
  string node_id = 31;
  string node_name = 32;
  string node_host = 33;
  int64 node_port = 34;
  int64 disk_usage_bytes = 35;
  int64 uptime_seconds = 36;
  int64 memory_working_set_bytes = 37;
  double memory_percent = 38;
  int32 cpu_cores = 39;
  double io_read_rate = 40;
  double io_write_rate = 41;
  int32 connection_count = 42;
  repeated string effective_permissions = 43;
  string server_software = 44;
  Game game = 45;
  string server_executable = 46;
  optional VersionInfo version_info = 47;
}

enum VersionStatus {
  VERSION_STATUS_NO_TRACKER = 0;
  VERSION_STATUS_UNCHECKED = 1;
  VERSION_STATUS_CHECKING = 2;
  VERSION_STATUS_CHECKED = 3;
  VERSION_STATUS_ERROR = 4;
}

message VersionInfo {
  string installed_version = 1;
  string latest_version = 2;
  bool update_available = 3;
  int64 last_check_time = 4;
  string tracker_type = 5;
  VersionStatus status = 6;
}

message IP {
  string address = 1;
  bool usable = 2;
  bool external = 3;
  string node_id = 4;
}

message StartGameServerRequest {
  string server_id = 1;
}
message StartGameServerResponse {
  string error = 1;
}

message StopGameServerRequest {
  string server_id = 1;
}
message StopGameServerResponse {}

message RestartGameServerRequest {
  string server_id = 1;
}
message RestartGameServerResponse {}

message RemoveGameServerRequest {
  string server_id = 1;
}
message RemoveGameServerResponse {}

message CreateGameServerRequest {
  GameServer game_server = 1;
}
message CreateGameServerResponse {
  GameServer game_server = 1;
  optional Error error = 2;
}

message EditGameServerRequest {
  string server_id = 1;
  GameServer game_server = 2;
}

message EditGameServerResponse {
  GameServer game_Server = 1;
}

message ReadGameServerOutputRequest {
  string server_id = 1;
}
message ReadGameServerOutputResponse {
  string output = 1;
}

message SendGameServerInputRequest {
  string server_id = 1;
  string input = 2;
}
message SendGameServerInputResponse {}

message AllServersQueryInfo {
  map<string, ServerQuery> servers = 1;
}

message ServerQuery {
  string server_id = 1;
  string server_name = 2;
  enum Type {
    Unknown = 0;
    Minecraft = 1;
    Source = 2;
  }
  Type type = 3;
  optional MinecraftQueryInfo minecraft = 4;
  optional SourceQueryInfo source = 5;
}

message MinecraftQueryInfo {
  string motd = 1;
  string game_type = 2;
  string map = 3;
  uint32 number_of_players = 4;
  uint32 max_players = 5;
  repeated string player_list = 6;
  uint32 protocol_version = 7;
  string server_version = 8;
}

message SourceQueryInfo {
  string name = 1;
  string map = 2;
  string game = 3;
  uint32 app_id = 4;
  uint64 steam_id = 5;
  uint64 game_id = 6;
  uint32 players = 7;
  uint32 max_players = 8;
  uint32 bots = 9;
  string server_os = 10;
  bool visibility = 11;
  bool vac = 12;
  string version = 13;
  uint32 protocol = 14;
}

message Node {
  string id = 1;
  string name = 2;
  string host = 3;
  int64 port = 5;
  bool local = 6;
  string secret_key = 7;
  string base_url = 8;
  bool enabled = 9;
  google.protobuf.Timestamp last_seen_at = 10;
  google.protobuf.Timestamp last_sync_at = 11;
  string last_sync_status = 12;
  string health_status = 13;
  string version = 14;
  int64 protocol_version = 15;
  string capabilities = 16;
  google.protobuf.Timestamp created_at = 17;
  google.protobuf.Timestamp updated_at = 18;
  bool allow_insecure_tls = 19;
  bool departed = 20;
  bool auto_paired = 21;
}

message SecretKey {
  int64 id = 1;
  string name = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp last_used = 4;
  string last_accessed_from = 5;
}

// NodeSystemInfo contains static hardware and OS information for a node.
message NodeSystemInfo {
  string cpu_model = 1;
  int32 cpu_cores = 2;
  int32 cpu_threads = 3;
  int64 total_memory_bytes = 4;
  string os = 5;
  string os_version = 6;
  string architecture = 7;
  string xylona_version = 8;
}

// NodeResourceSnapshot contains a point-in-time resource usage snapshot for a node.
message NodeResourceSnapshot {
  double cpu_percent = 1;
  double memory_percent = 2;
  int64 memory_used_bytes = 3;
  int64 memory_total_bytes = 4;
  double disk_percent = 5;
  int64 disk_used_bytes = 6;
  int64 disk_total_bytes = 7;
  int32 game_server_count = 8;
  int32 running_game_server_count = 9;
  int32 user_count = 10;
  google.protobuf.Timestamp recorded_at = 11;
}

// MetricsHistoryPoint is a single data point in a node metrics time series.
message MetricsHistoryPoint {
  google.protobuf.Timestamp timestamp = 1;
  double cpu_percent = 2;
  double memory_percent = 3;
  double disk_percent = 4;
  int64 memory_used_bytes = 5;
  int64 disk_used_bytes = 6;
}

// GameServerMetricsHistoryPoint is a single data point in a game server metrics time series.
message GameServerMetricsHistoryPoint {
  google.protobuf.Timestamp timestamp = 1;
  double cpu_percent = 2;
  int64 memory_bytes = 3;
  double memory_percent = 4;
  int64 disk_usage_bytes = 5;
  int32 player_count = 6;
}

message InstalledMod {
  string id = 1;
  string game_server_id = 2;
  string source = 3;
  string source_id = 4;
  string mod_name = 5;
  string mod_author = 6;
  string installed_version = 7;
  string installed_version_id = 8;
  string file_hash = 9;
  bool auto_update = 10;
  bool enabled = 11;
  string pinned_version = 12;
  bool update_available = 13;
  string latest_version = 14;
  google.protobuf.Timestamp created_at = 15;
  google.protobuf.Timestamp updated_at = 16;
  repeated InstalledModFile files = 17;
}

message InstalledModFile {
  string id = 1;
  string installed_mod_id = 2;
  string file_path = 3;
  string file_hash = 4;
  int64 file_size = 5;
  bool is_primary = 6;
}

message ModSearchResult {
  string source = 1;
  string source_id = 2;
  string name = 3;
  string author = 4;
  string description = 5;
  string icon_url = 6;
  int64 downloads = 7;
  string latest_version = 8;
  repeated string compatible_versions = 9;
  bool is_installed = 10;
  repeated string categories = 11;
  string date_modified = 12;
}

message ModDetails {
  string source = 1;
  string source_id = 2;
  string name = 3;
  string author = 4;
  string description = 5;
  string body = 6;
  string icon_url = 7;
  int64 downloads = 8;
  repeated string gallery_images = 9;
  repeated string categories = 10;
  string license = 11;
  string source_url = 12;
  repeated ModVersion versions = 13;
  google.protobuf.Timestamp updated_at = 14;
}

message ModVersion {
  string version_id = 1;
  string version_string = 2;
  repeated string game_versions = 3;
  string download_url = 4;
  int64 file_size = 5;
  repeated ModDependency dependencies = 6;
  string changelog = 7;
  google.protobuf.Timestamp published_at = 8;
}

message ModDependency {
  string source_id = 1;
  string name = 2;
  bool required = 3;
}

message NodeApiKey {
  string id = 1;
  string service_name = 2;
  string masked_key = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
}

message ServerSoftwareOption {
  string id = 1;
  string name = 2;
  string jar_source = 3;
  bool has_mod_support = 4;
}

message SoftwareVersion {
  string version_id = 1;
  string version_string = 2;
  int32 build_number = 3;
  string channel = 4;
}
