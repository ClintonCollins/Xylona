enum GameConsoleCommandRisk {
  GAME_CONSOLE_COMMAND_RISK_UNSPECIFIED = 0;
  GAME_CONSOLE_COMMAND_RISK_NONE = 1;
  GAME_CONSOLE_COMMAND_RISK_CAUTION = 2;
  GAME_CONSOLE_COMMAND_RISK_DESTRUCTIVE = 3;
}

message GameConsoleCommandArgument {
  string name = 1;
  string description = 2;
  bool required = 3;
  bool repeatable = 4;
  string value_type = 5;
  repeated string suggested_values = 6;
  string default_value = 7;
