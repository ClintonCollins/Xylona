syntax = "proto3";
import "google/protobuf/timestamp.proto";
import "gameserver_files_operations.proto";

package xylona;
option go_package = 'github.com/ClintonCollins/Xylona/proto/go/xylona';

enum Error {
  BAD_REQUEST = 0;
  PORT_IN_USE = 1;
  GAME_SERVER_ALREADY_EXISTS = 2;
  USER_ALREADY_EXISTS = 3;
}

message GameServerFilesArchiveProgress {
  int64 total_files = 1;
  int64 files_compressed = 2;
  int64 total_bytes = 3;
  int64 bytes_compressed = 4;
  string current_file = 5;
}

message GameServerFilesExtractProgress {
  int64 total_files = 1;
  int64 files_extracted = 2;
  int64 total_bytes = 3;
  int64 bytes_extracted = 4;
  string current_file = 5;
}

enum CommandProcessor {
  DIRECT = 0;
  XYLONA_INTERNAL = 1;
  BASH = 2;
  CMD = 3;
  POWERSHELL = 4;
}

enum CommandType {
  NONE = 0;
  COMMAND = 1;
  STEAMCMD = 2;
  PAPERMC = 3;
  MOJANG = 4;
}

enum UpdateProviderKind {
  UPDATE_PROVIDER_KIND_NONE = 0;
  UPDATE_PROVIDER_KIND_STEAMCMD = 1;
  UPDATE_PROVIDER_KIND_PAPERMC = 2;
  UPDATE_PROVIDER_KIND_MOJANG = 3;
  UPDATE_PROVIDER_KIND_COMMAND = 4;
}

message UpdateProviderConfig {
  UpdateProviderKind kind = 1;
  string source_id = 2;
}

message ModSource {
  string id = 1;
  string search_params_json = 2;
}

message ModProfile {
  string install_path = 1;
  repeated ModSource sources = 2;
}

message Variant {
  string id = 1;
  string name = 2;
  UpdateProviderConfig update_provider = 3;
  string default_target = 4;
  ModProfile mod_profile = 5;
}

message UpdateTargetOption {
  string id = 1;
  string label = 2;
  string description = 3;
  string latest_version = 4;
  bool is_selected = 5;
}

message Game {
  string id = 1;
  string name = 2;
  int64 default_port = 3;
  int64 default_query_port = 4;
  int64 default_max_players = 5;
  bool linux_support = 6;
  bool windows_support = 7;
  reserved 8;
  reserved "linux_start_command";
  string linux_stop_command = 9;
  string linux_install_command = 10;
  string linux_update_command = 11;
  string linux_working_directory = 12;
  reserved 13;
  reserved "linux_configuration_file_paths";
  bool linux_allow_backups = 14;
  reserved 15;
  reserved "windows_start_command";
  string windows_stop_command = 16;
  string windows_install_command = 17;
  string windows_update_command = 18;
  string windows_working_directory = 19;
  reserved 20;
  reserved "windows_configuration_file_paths";
  bool windows_allow_backups = 21;
  bool require_dedicated_ip = 22;
  bool binds_to_all_ips = 23;
  google.protobuf.Timestamp created_at = 24;
  google.protobuf.Timestamp updated_at = 25;
  bool uses_source_query = 26;
  bool requires_steam_game_server_login_token = 27;
  CommandProcessor linux_install_command_processor = 28;
  CommandProcessor linux_update_command_processor = 29;
  CommandProcessor windows_install_command_processor = 30;
  CommandProcessor windows_update_command_processor = 31;
  bool uses_steamcmd = 32;
  string steam_appid = 33;
  string config_schemas = 70; // JSON blob, parsed by application layer
  reserved 71;
  reserved "server_software";
  UpdateProviderConfig update_provider = 72;
  string default_target = 73;
  ModProfile mod_profile = 74;
  repeated Variant variants = 75;
  CommandType linux_install_type = 76;
  CommandType linux_update_type = 77;
  CommandType windows_install_type = 78;
  CommandType windows_update_type = 79;
  string linux_start_args_template = 80;
  string windows_start_args_template = 81;
  string linux_base_command = 82;
  string windows_base_command = 83;
  string start_arg_blocklist = 84;
  bool allow_start_arg_editing = 85;
  bool xylona_official = 86;
  string official_definition_hash = 87;
  string official_definition_source = 88;
  int64 official_definition_schema_version = 89;
  bool official_definition_diverged = 90;
  repeated GameConsoleCommand console_commands = 91;
}

message SteamApp {
  string app_id = 1;
  string name = 2;
}

message SteamAppDetails {
  string app_id = 1;
  string name = 2;
  bool windows_support = 3;
  bool linux_support = 4;
  string install_directory = 5;
  string parent_app_id = 6;
  repeated SteamLaunchConfig launch_configs = 7;
}

message SteamLaunchConfig {
  string executable = 1;
  string arguments = 2;
  string os = 3;
  string description = 4;
}

enum Status {
  UNKNOWN = 0;
  OFFLINE = 1;
  ONLINE = 2;
  INSTALLING = 3;
  UPDATING = 4;
  PRE_START = 5;
}

message GameServerPlayer {
  string name = 1;
  optional string id = 2;
  optional string steam_id = 3;
}

message GameServer {
  string id = 1;
  string user_id = 2;
  string name = 3;
  string game_id = 4;
  reserved 5;
  reserved "start_command";
  Status status = 6;
  int64 set_max_players = 7;
  int64 max_players = 8;
  string map = 9;
  IP ip = 10;
  int64 port = 11;
  int64 query_port = 12;
  string directory = 13;
  int64 max_memory_mb = 14;
  bool backups_enabled = 15;
  string backup_directory = 16;
  int64 max_backups = 17;
  google.protobuf.Timestamp created_at = 18;
  google.protobuf.Timestamp updated_at = 19;
  reserved 20;
  reserved "steam_game_server_login_token";
  string user_name = 21;
  string game_name = 22;
  int64 cpu_percent = 23;
  int64 memory_bytes = 24;
  int64 number_of_threads = 25;
  string version = 26;
  int64 current_player_count = 27;
  repeated GameServerPlayer current_players = 28;
  reserved 29;
  reserved "steam_branch";
  string selected_target = 30;
  string node_id = 31;
  string node_name = 32;
  string node_host = 33;
  int64 node_port = 34;
  int64 disk_usage_bytes = 35;
  int64 uptime_seconds = 36;
  int64 memory_working_set_bytes = 37;
  double memory_percent = 38;
  int32 cpu_cores = 39;
  double io_read_rate = 40;
  double io_write_rate = 41;
  int32 connection_count = 42;
  repeated string effective_permissions = 43;
  string selected_variant_id = 44;
  Game game = 45;
  string server_executable = 46;
  optional VersionInfo version_info = 47;
  UpdateProviderConfig resolved_update_provider = 48;
  ModProfile resolved_mod_profile = 49;
  bool resolved_has_update = 50;
  bool resolved_has_mod_support = 51;
  bool selected_target_pinned = 52;
  string start_args_patches = 53;
  bool auto_restart_enabled = 54;
  int64 auto_restart_max_retries = 55;
  int64 auto_restart_cooldown_seconds = 56;
  bool io_valid = 57;
  bool connection_count_valid = 58;
  string base_command_override = 59;
}

message EnvironmentVariable {
  string name = 1;
  string value = 2;
}

message SecretEnvironmentVariableState {
  string name = 1;
  bool configured = 2;
  google.protobuf.Timestamp updated_at = 3;
}

message EnvironmentValidationIssue {
  string name = 1;
  string message = 2;
}

enum VersionStatus {
  VERSION_STATUS_NO_TRACKER = 0;
  VERSION_STATUS_UNCHECKED = 1;
  VERSION_STATUS_CHECKING = 2;
  VERSION_STATUS_CHECKED = 3;
  VERSION_STATUS_ERROR = 4;
}

message VersionInfo {
  string installed_version = 1;
  string latest_version = 2;
  bool update_available = 3;
  int64 last_check_time = 4;
  string tracker_type = 5;
  VersionStatus status = 6;
  string installed_version_label = 7;
  string latest_version_label = 8;
  string installed_branch = 9;
  string latest_branch = 10;
}

message IP {
  string address = 1;
  bool usable = 2;
  bool external = 3;
  string node_id = 4;
}

message StartGameServerRequest {
  string server_id = 1;
}
message StartGameServerResponse {
  string error = 1;
}

message StopGameServerRequest {
  string server_id = 1;
}
message StopGameServerResponse {}

message RestartGameServerRequest {
  string server_id = 1;
}
message RestartGameServerResponse {}

message RemoveGameServerRequest {
  string server_id = 1;
}
message RemoveGameServerResponse {}

message CreateGameServerRequest {
  reserved 2;
  reserved "accept_minecraft_eula";

  GameServer game_server = 1;
  repeated EnvironmentVariable env_vars = 3;
}
message CreateGameServerResponse {
  GameServer game_server = 1;
  optional Error error = 2;
}

message EditGameServerRequest {
  string server_id = 1;
  GameServer game_server = 2;
}

message EditGameServerResponse {
  GameServer game_Server = 1;
}

message ReadGameServerOutputRequest {
  string server_id = 1;
}
message ReadGameServerOutputResponse {
  string output = 1;
}

message SendGameServerInputRequest {
  string server_id = 1;
  string input = 2;
}
message SendGameServerInputResponse {}

message AllServersQueryInfo {
  map<string, ServerQuery> servers = 1;
}

message ServerQuery {
  string server_id = 1;
  string server_name = 2;
  enum Type {
    Unknown = 0;
    Minecraft = 1;
    Source = 2;
    Palworld = 3;
  }
  Type type = 3;
  optional MinecraftQueryInfo minecraft = 4;
  optional SourceQueryInfo source = 5;
  optional PalworldQueryInfo palworld = 6;
}

message MinecraftQueryInfo {
  string motd = 1;
  string game_type = 2;
  string map = 3;
  uint32 number_of_players = 4;
  uint32 max_players = 5;
  repeated string player_list = 6;
  uint32 protocol_version = 7;
  string server_version = 8;
  bool player_list_supported = 9;
  bool responded = 10;
}

message SourceQueryInfo {
  string name = 1;
  string map = 2;
  string game = 3;
  uint32 app_id = 4;
  uint64 steam_id = 5;
  uint64 game_id = 6;
  uint32 players = 7;
  uint32 max_players = 8;
  uint32 bots = 9;
  string server_os = 10;
  bool visibility = 11;
  bool vac = 12;
  string version = 13;
  uint32 protocol = 14;
  repeated string player_list = 15;
  bool player_list_supported = 16;
  bool responded = 17;
}

message PalworldQueryInfo {
  string name = 1;
  string description = 2;
  string version = 3;
  string world_guid = 4;
  uint32 players = 5;
  uint32 max_players = 6;
  repeated string player_list = 7;
  uint64 uptime_seconds = 8;
  double server_fps = 9;
  double server_frame_time_ms = 10;
  uint32 days = 11;
  bool responded = 12;
}

message Node {
  string id = 1;
  string name = 2;
  string host = 3;
  int64 port = 5;
  bool local = 6;
  string secret_key = 7;
  string base_url = 8;
  bool enabled = 9;
  google.protobuf.Timestamp last_seen_at = 10;
  google.protobuf.Timestamp last_sync_at = 11;
  string last_sync_status = 12;
  string health_status = 13;
  string version = 14;
  int64 protocol_version = 15;
  string capabilities = 16;
  google.protobuf.Timestamp created_at = 17;
  google.protobuf.Timestamp updated_at = 18;
  bool allow_insecure_tls = 19;
  bool departed = 20;
  bool auto_paired = 21;
  string os = 22;
}

// NodeSystemInfo contains static hardware and OS information for a node.
message NodeSystemInfo {
  string cpu_model = 1;
  int32 cpu_cores = 2;
  int32 cpu_threads = 3;
  int64 total_memory_bytes = 4;
  string os = 5;
  string os_version = 6;
  string architecture = 7;
  string xylona_version = 8;
}

// NodeResourceSnapshot contains a point-in-time resource usage snapshot for a node.
message NodeResourceSnapshot {
  double cpu_percent = 1;
  double memory_percent = 2;
  int64 memory_used_bytes = 3;
  int64 memory_total_bytes = 4;
  double disk_percent = 5;
  int64 disk_used_bytes = 6;
  int64 disk_total_bytes = 7;
  int32 game_server_count = 8;
  int32 running_game_server_count = 9;
  int32 user_count = 10;
  google.protobuf.Timestamp recorded_at = 11;
}

// MetricsHistoryPoint is a single data point in a node metrics time series.
message MetricsHistoryPoint {
  google.protobuf.Timestamp timestamp = 1;
  double cpu_percent = 2;
  double memory_percent = 3;
  double disk_percent = 4;
  int64 memory_used_bytes = 5;
  int64 disk_used_bytes = 6;
}

enum GameServerMetricsCollectionStatus {
  GAME_SERVER_METRICS_COLLECTION_STATUS_UNSPECIFIED = 0;
  GAME_SERVER_METRICS_COLLECTION_STATUS_AVAILABLE = 1;
  GAME_SERVER_METRICS_COLLECTION_STATUS_WARMING_UP = 2;
  GAME_SERVER_METRICS_COLLECTION_STATUS_SERVER_OFFLINE = 3;
  GAME_SERVER_METRICS_COLLECTION_STATUS_NODE_UNAVAILABLE = 4;
  GAME_SERVER_METRICS_COLLECTION_STATUS_COLLECTOR_ERROR = 5;
}

enum GameServerMetricsResolution {
  GAME_SERVER_METRICS_RESOLUTION_UNSPECIFIED = 0;
  GAME_SERVER_METRICS_RESOLUTION_RAW = 1;
  GAME_SERVER_METRICS_RESOLUTION_HOURLY = 2;
  GAME_SERVER_METRICS_RESOLUTION_DOWNSAMPLED = 3;
  GAME_SERVER_METRICS_RESOLUTION_MIXED = 4;
}

// GameServerMetricsHistoryPoint is a single raw or aggregated point in a game server metrics time series.
// Existing value fields contain the sample value for raw points and the average for aggregated points.
message GameServerMetricsHistoryPoint {
  google.protobuf.Timestamp timestamp = 1;
  double cpu_percent = 2;
  // Deprecated: use memory_rss_bytes. This field is retained for API compatibility.
  int64 memory_bytes = 3;
  double memory_percent = 4;
  int64 disk_usage_bytes = 5;
  int32 player_count = 6;
  double io_read_rate = 7;
  double io_write_rate = 8;
  int32 connection_count = 9;
  int64 memory_rss_bytes = 10;
  bool cpu_valid = 11;
  optional double cpu_percent_min = 12;
  optional double cpu_percent_max = 13;
  optional int32 node_cpu_cores = 14;
  optional int64 memory_rss_bytes_min = 15;
  optional int64 memory_rss_bytes_max = 16;
  optional double memory_percent_min = 17;
  optional double memory_percent_max = 18;
  optional int64 node_memory_used_bytes = 19;
  optional int64 node_memory_total_bytes = 20;
  optional int64 configured_memory_bytes = 21;
  optional int64 disk_usage_bytes_min = 22;
  optional int64 disk_usage_bytes_max = 23;
  optional int64 volume_total_bytes = 24;
  optional int64 volume_free_bytes = 25;
  optional double volume_percent = 26;
  bool volume_valid = 27;
  google.protobuf.Timestamp disk_measured_at = 28;
  optional double io_read_rate_min = 29;
  optional double io_read_rate_max = 30;
  optional double io_write_rate_min = 31;
  optional double io_write_rate_max = 32;
  optional int32 connection_count_min = 33;
  optional int32 connection_count_max = 34;
  bool player_count_valid = 35;
  optional int32 player_count_min = 36;
  optional int32 player_count_max = 37;
  optional int32 player_capacity = 38;
  optional bool query_supported = 39;
  optional bool query_success = 40;
  optional double query_duration_ms = 41;
  optional double query_duration_ms_min = 42;
  optional double query_duration_ms_max = 43;
  google.protobuf.Timestamp query_checked_at = 44;
  optional double server_fps = 45;
  optional double server_fps_min = 46;
  optional double server_fps_max = 47;
  optional double server_frame_time_ms = 48;
  optional double server_frame_time_ms_min = 49;
  optional double server_frame_time_ms_max = 50;
  optional int64 server_uptime_seconds = 51;
  string process_status = 52;
  string execution_id = 53;
  GameServerMetricsCollectionStatus collection_status = 54;
  google.protobuf.Timestamp process_collected_at = 55;
  int32 granularity_seconds = 56;
  int32 sample_count = 57;
  int32 available_sample_count = 58;
  double availability_ratio = 59;
  string node_id = 60;
  int32 cpu_valid_sample_count = 61;
  int32 query_successful_sample_count = 62;
  int32 volume_valid_sample_count = 63;
  int32 io_valid_sample_count = 64;
  int32 connection_valid_sample_count = 65;
  bool io_valid = 66;
  bool connection_count_valid = 67;
  int32 query_duration_valid_sample_count = 68;
  int32 server_fps_valid_sample_count = 69;
  int32 server_frame_time_valid_sample_count = 70;
}

message GameServerLifecycleHistoryEvent {
  string id = 1;
  string game_server_id = 2;
  string node_id = 3;
  string execution_id = 4;
  uint64 transition_sequence = 5;
  string previous_status = 6;
  string status = 7;
  bool intentional_stop = 8;
  optional int32 exit_code = 9;
  google.protobuf.Timestamp observed_at = 10;
}

message GameServerOperationHistoryEvent {
  string id = 1;
  string game_server_id = 2;
  string operation = 3;
  optional string phase = 4;
  string outcome = 5;
  google.protobuf.Timestamp started_at = 6;
  google.protobuf.Timestamp completed_at = 7;
  optional int64 duration_ms = 8;
  optional int64 bytes_processed = 9;
  string source = 10;
}

message InstalledMod {
  string id = 1;
  string game_server_id = 2;
  string source = 3;
  string source_id = 4;
  string mod_name = 5;
  string mod_author = 6;
  string installed_version = 7;
  string installed_version_id = 8;
  string file_hash = 9;
  bool auto_update = 10;
  bool enabled = 11;
  string pinned_version = 12;
  bool update_available = 13;
  string latest_version = 14;
  google.protobuf.Timestamp created_at = 15;
  google.protobuf.Timestamp updated_at = 16;
  repeated InstalledModFile files = 17;
}

message InstalledModFile {
  string id = 1;
  string installed_mod_id = 2;
  string file_path = 3;
  string file_hash = 4;
  int64 file_size = 5;
  bool is_primary = 6;
}

message ModSearchResult {
  string source = 1;
  string source_id = 2;
  string name = 3;
  string author = 4;
  string description = 5;
  string icon_url = 6;
  int64 downloads = 7;
  string latest_version = 8;
  repeated string compatible_versions = 9;
  bool is_installed = 10;
  repeated string categories = 11;
  string date_modified = 12;
}

message ModDetails {
  string source = 1;
  string source_id = 2;
  string name = 3;
  string author = 4;
  string description = 5;
  string body = 6;
  string icon_url = 7;
  int64 downloads = 8;
  repeated string gallery_images = 9;
  repeated string categories = 10;
  string license = 11;
  string source_url = 12;
  repeated ModVersion versions = 13;
  google.protobuf.Timestamp updated_at = 14;
}

message ModVersion {
  string version_id = 1;
  string version_string = 2;
  repeated string game_versions = 3;
  string download_url = 4;
  int64 file_size = 5;
  repeated ModDependency dependencies = 6;
  string changelog = 7;
  google.protobuf.Timestamp published_at = 8;
}

message ModDependency {
  string source_id = 1;
  string name = 2;
  bool required = 3;
}

enum AlertEventType {
  ALERT_EVENT_TYPE_UNSPECIFIED = 0;
  ALERT_EVENT_TYPE_CRASH = 1;
  ALERT_EVENT_TYPE_STATUS_CHANGE = 2;
  ALERT_EVENT_TYPE_CPU_THRESHOLD = 3;
  ALERT_EVENT_TYPE_MEMORY_THRESHOLD = 4;
  ALERT_EVENT_TYPE_DISK_THRESHOLD = 5;
  ALERT_EVENT_TYPE_PLAYER_COUNT_THRESHOLD = 6;
  ALERT_EVENT_TYPE_NODE_CPU_THRESHOLD = 7;
  ALERT_EVENT_TYPE_NODE_MEMORY_THRESHOLD = 8;
  ALERT_EVENT_TYPE_NODE_DISK_THRESHOLD = 9;
}

enum ThresholdDirection {
  THRESHOLD_DIRECTION_UNSPECIFIED = 0;
  THRESHOLD_DIRECTION_ENTERED = 1;
  THRESHOLD_DIRECTION_RESOLVED = 2;
}

enum NotificationChannelType {
  NOTIFICATION_CHANNEL_TYPE_UNSPECIFIED = 0;
  NOTIFICATION_CHANNEL_TYPE_WEBHOOK_DISCORD = 1;
  NOTIFICATION_CHANNEL_TYPE_WEBHOOK_SLACK = 2;
  NOTIFICATION_CHANNEL_TYPE_WEBHOOK_GENERIC = 3;
  NOTIFICATION_CHANNEL_TYPE_EMAIL = 4;
}

enum DeliveryStatus {
  DELIVERY_STATUS_UNSPECIFIED = 0;
  DELIVERY_STATUS_PENDING = 1;
  DELIVERY_STATUS_SENT = 2;
  DELIVERY_STATUS_FAILED = 3;
}

message NotificationChannel {
  string id = 1;
  string user_id = 2;
  string name = 3;
  NotificationChannelType channel_type = 4;
  string config = 5;
  bool enabled = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message AlertRule {
  string id = 1;
  string user_id = 2;
  optional string server_id = 3;
  optional string server_node_id = 4;
  optional string node_id = 5;
  AlertEventType event_type = 6;
  string condition = 7;
  string notification_channel_id = 8;
  bool enabled = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

message AlertHistoryEntry {
  string id = 1;
  optional string alert_rule_id = 2;
  string user_id = 3;
  optional string server_id = 4;
  optional string server_node_id = 5;
  optional string node_id = 6;
  AlertEventType event_type = 7;
  string event_data = 8;
  NotificationChannelType channel_type = 9;
  DeliveryStatus delivery_status = 10;
  optional string delivery_error = 11;
  google.protobuf.Timestamp created_at = 12;
}

enum SystemEmailProvider {
  SYSTEM_EMAIL_PROVIDER_UNSPECIFIED = 0;
  SYSTEM_EMAIL_PROVIDER_SMTP = 1;
  SYSTEM_EMAIL_PROVIDER_GOOGLE = 2;
}

message SystemSMTPConfig {
  string host = 1;
  int32 port = 2;
  string user = 3;
  string password = 4;
  string from_address = 5;
  bool tls_enabled = 6;
  SystemEmailProvider provider = 7;
  string google_client_id = 8;
  string google_client_secret = 9;
  string google_refresh_token = 10;
  string google_email = 11;
}

// --- Scheduled Tasks ---

message ScheduledTask {
  string id = 1;
  string game_server_id = 2;
  string created_by = 3;
  string name = 4;
  string task_type = 5;
  string cron_expression = 6;
  string timezone = 7;
  optional string console_command = 8;
  bool enabled = 9;
  optional google.protobuf.Timestamp last_run_at = 10;
  optional google.protobuf.Timestamp next_run_at = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
  string cron_description = 14;
}

message ScheduledTaskLog {
  string id = 1;
  string scheduled_task_id = 2;
  string game_server_id = 3;
  string task_type = 4;
  string status = 5;
  optional string message = 6;
  google.protobuf.Timestamp started_at = 7;
  optional google.protobuf.Timestamp finished_at = 8;
  google.protobuf.Timestamp created_at = 9;
}

enum GameServerBackupStatus {
  GAME_SERVER_BACKUP_STATUS_UNSPECIFIED = 0;
  GAME_SERVER_BACKUP_STATUS_PENDING = 1;
  GAME_SERVER_BACKUP_STATUS_COMPLETED = 2;
  GAME_SERVER_BACKUP_STATUS_FAILED = 3;
}

enum GameServerBackupTriggerSource {
  GAME_SERVER_BACKUP_TRIGGER_SOURCE_UNSPECIFIED = 0;
  GAME_SERVER_BACKUP_TRIGGER_SOURCE_MANUAL = 1;
  GAME_SERVER_BACKUP_TRIGGER_SOURCE_SCHEDULED = 2;
}

enum BackupRestoreMode {
  BACKUP_RESTORE_MODE_UNSPECIFIED = 0;
  BACKUP_RESTORE_MODE_OVERLAY = 1;
  BACKUP_RESTORE_MODE_EXACT = 2;
}

enum BackupProgressOperation {
  BACKUP_PROGRESS_OPERATION_UNSPECIFIED = 0;
  BACKUP_PROGRESS_OPERATION_CREATE = 1;
  BACKUP_PROGRESS_OPERATION_RESTORE = 2;
}

enum BackupProgressPhase {
  BACKUP_PROGRESS_PHASE_UNSPECIFIED = 0;
  BACKUP_PROGRESS_PHASE_PREPARING = 1;
  BACKUP_PROGRESS_PHASE_ARCHIVING = 2;
  BACKUP_PROGRESS_PHASE_STAGING = 3;
  BACKUP_PROGRESS_PHASE_APPLYING = 4;
  BACKUP_PROGRESS_PHASE_PRUNING = 5;
  BACKUP_PROGRESS_PHASE_COMPLETE = 6;
  BACKUP_PROGRESS_PHASE_FAILED = 7;
}

message GameServerBackup {
  string id = 1;
  string game_server_id = 2;
  string node_id = 3;
  optional string created_by = 4;
  GameServerBackupTriggerSource trigger_source = 5;
  string archive_path = 6;
  string archive_format = 7;
  GameServerBackupStatus status = 8;
  int64 size_bytes = 9;
  bool retention_exempt = 10;
  optional string error_message = 11;
  google.protobuf.Timestamp created_at = 12;
  optional google.protobuf.Timestamp completed_at = 13;
