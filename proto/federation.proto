syntax = "proto3";
import "google/protobuf/timestamp.proto";
import "shared.proto";
import "gameserver_files_operations.proto";

package xylona;
option go_package = 'github.com/ClintonCollins/Xylona/proto/go/xylona';

// Federation service for node-to-node communication.
service Federation {
  // Handshake returns the identity and capabilities of this node.
  rpc Handshake (FederationHandshakeRequest) returns (FederationHandshakeResponse) {}

  // ListServerSummaries returns summaries of all local game servers for federation sync.
  rpc ListServerSummaries (FederationListServerSummariesRequest) returns (FederationListServerSummariesResponse) {}

  // ListUserSummaries returns users for on-demand grant workflows.
  rpc ListUserSummaries (FederationListUserSummariesRequest) returns (FederationListUserSummariesResponse) {}

  // GetServerDetail returns detailed info for a single local game server.
  rpc GetServerDetail (FederationGetServerDetailRequest) returns (FederationGetServerDetailResponse) {}

  // StartRemoteServer starts a game server on this node.
  rpc StartRemoteServer (FederationRemoteActionRequest) returns (FederationRemoteActionResponse) {}

  // StopRemoteServer stops a game server on this node.
  rpc StopRemoteServer (FederationRemoteActionRequest) returns (FederationRemoteActionResponse) {}

  // RestartRemoteServer restarts a game server on this node.
  rpc RestartRemoteServer (FederationRemoteActionRequest) returns (FederationRemoteActionResponse) {}

  // UpdateRemoteServer triggers an update for a game server on this node.
  rpc UpdateRemoteServer (FederationRemoteActionRequest) returns (FederationRemoteActionResponse) {}

  // EditRemoteServer edits a game server's configuration on this node.
  rpc EditRemoteServer (FederationEditServerRequest) returns (FederationEditServerResponse) {}

  // RemoveRemoteServer removes a game server on this node.
  rpc RemoveRemoteServer (FederationRemoteActionRequest) returns (FederationRemoteActionResponse) {}

  // StreamConsoleOutput streams real-time console output for a game server on this node.
  rpc StreamConsoleOutput (FederationStreamConsoleRequest) returns (stream FederationConsoleOutputChunk) {}

  // SendConsoleInput sends a command to a game server's console on this node.
  rpc SendConsoleInput (FederationSendConsoleInputRequest) returns (FederationSendConsoleInputResponse) {}

  // ReadConsoleBuffer returns the current console output buffer for a game server.
  rpc ReadConsoleBuffer (FederationReadConsoleBufferRequest) returns (FederationReadConsoleBufferResponse) {}

  // StreamServerStatuses streams real-time status changes for all game servers on this node.
  rpc StreamServerStatuses (FederationStreamServerStatusesRequest) returns (stream FederationServerStatusEvent) {}

  // QueryRemoteServer returns query info (player count, etc.) for a game server on this node.
  rpc QueryRemoteServer (FederationQueryServerRequest) returns (FederationQueryServerResponse) {}

  // File operations on remote servers.
  rpc ListRemoteDirectoryFiles (FederationListDirectoryFilesRequest) returns (FederationListDirectoryFilesResponse) {}
  rpc EditRemoteFile (FederationEditFileRequest) returns (FederationEditFileResponse) {}
  rpc DeleteRemoteFiles (FederationDeleteFilesRequest) returns (FederationDeleteFilesResponse) {}
  rpc RenameRemoteFile (FederationRenameFileRequest) returns (FederationRenameFileResponse) {}
  rpc MoveRemoteFiles (FederationMoveFilesRequest) returns (FederationMoveFilesResponse) {}
  rpc CreateRemoteFileOrDirectory (FederationCreateFileOrDirectoryRequest) returns (FederationCreateFileOrDirectoryResponse) {}
  rpc DownloadRemoteFileFromURL (FederationDownloadFileFromURLRequest) returns (FederationDownloadFileFromURLResponse) {}

  // RBAC operations on remote servers.
  rpc ListRemoteGameServerAccessGrants (FederationListGameServerAccessGrantsRequest) returns (FederationListGameServerAccessGrantsResponse) {}
  rpc GrantRemoteGameServerAccess (FederationGrantGameServerAccessRequest) returns (FederationGrantGameServerAccessResponse) {}
  rpc RevokeRemoteGameServerAccess (FederationRevokeGameServerAccessRequest) returns (FederationRevokeGameServerAccessResponse) {}
  rpc ListRemoteFederatedAccessGrants (FederationListFederatedAccessGrantsRequest) returns (FederationListFederatedAccessGrantsResponse) {}
  rpc GrantRemoteFederatedAccess (FederationGrantFederatedAccessRequest) returns (FederationGrantFederatedAccessResponse) {}
  rpc RevokeRemoteFederatedAccess (FederationRevokeFederatedAccessRequest) returns (FederationRevokeFederatedAccessResponse) {}
}

// Federation Handshake
message FederationHandshakeRequest {
  string secret_key = 1;
}

message FederationHandshakeResponse {
  string node_id = 1;
  string node_name = 2;
  string version = 3;
  int32 protocol_version = 4;
  string capabilities = 5;
  google.protobuf.Timestamp server_time = 6;
}

// Federation Server Summaries
message FederationListServerSummariesRequest {
  string cursor = 1;
  int32 limit = 2;
}

message FederationServerSummary {
  string server_id = 1;
  string display_name = 2;
  Status status = 3;
  string game_name = 4;
  string game_id = 5;
  string ip_address = 6;
  int64 port = 7;
  int64 query_port = 8;
  int64 max_players = 9;
  int64 current_players = 10;
  string map_name = 11;
  string version = 12;
  google.protobuf.Timestamp updated_at = 13;
}

message FederationListServerSummariesResponse {
  repeated FederationServerSummary servers = 1;
  string next_cursor = 2;
  bool has_more = 3;
}

message FederationListUserSummariesRequest {
  int32 limit = 1;
}

message FederationUserSummary {
  string user_id = 1;
  string user_name = 2;
  string email = 3;
  string first_name = 4;
  string last_name = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message FederationListUserSummariesResponse {
  repeated FederationUserSummary users = 1;
}

// Federation Server Detail
message FederationGetServerDetailRequest {
  string server_id = 1;
}

message FederationGetServerDetailResponse {
  FederationServerSummary server = 1;
}

// Federation Remote Action
message FederationRemoteActionRequest {
  string server_id = 1;
  string acting_user_id = 2;
  string origin_node_id = 3;
}

message FederationRemoteActionResponse {
  bool success = 1;
  string error = 2;
}

// Federation Edit Server
message FederationEditServerRequest {
  string server_id = 1;
  GameServer game_server = 2;
}

message FederationEditServerResponse {
  bool success = 1;
  string error = 2;
  GameServer game_server = 3;
}

// Federation Console Streaming
message FederationStreamConsoleRequest {
  string server_id = 1;
  string secret_key = 2;
}

message FederationConsoleOutputChunk {
  string server_id = 1;
  string output = 2;
}

message FederationSendConsoleInputRequest {
  string server_id = 1;
  string input = 2;
}

message FederationSendConsoleInputResponse {
  bool success = 1;
  string error = 2;
}

message FederationReadConsoleBufferRequest {
  string server_id = 1;
}

message FederationReadConsoleBufferResponse {
  string output = 1;
}

// Federation Server Status Streaming
message FederationStreamServerStatusesRequest {
  string secret_key = 1;
}

message FederationServerStatusEvent {
  string server_id = 1;
  Status status = 2;
}

// Federation Query Server
message FederationQueryServerRequest {
  string server_id = 1;
}

message FederationQueryServerResponse {
  ServerQuery query_info = 1;
}

// Federation File Operations
message FederationListDirectoryFilesRequest {
  string server_id = 1;
  string path = 2;
}

message FederationListDirectoryFilesResponse {
  repeated File files = 1;
}

message FederationEditFileRequest {
  string server_id = 1;
  string full_file_path = 2;
  string content = 3;
}

message FederationEditFileResponse {
  bool success = 1;
  string error = 2;
}

message FederationDeleteFilesRequest {
  string server_id = 1;
  repeated string full_file_paths = 2;
}

message FederationDeleteFilesResponse {
  bool success = 1;
  string error = 2;
  repeated string full_file_paths = 3;
}

message FederationRenameFileRequest {
  string server_id = 1;
  string old_path = 2;
  string new_path = 3;
}

message FederationRenameFileResponse {
  bool success = 1;
  string error = 2;
  string new_path = 3;
}

message FederationMoveFilesRequest {
  string server_id = 1;
  repeated string full_file_paths = 2;
  string destination_base_path = 3;
}

message FederationMoveFilesResponse {
  bool success = 1;
  string error = 2;
  repeated string full_file_paths = 3;
}

message FederationCreateFileOrDirectoryRequest {
  string server_id = 1;
  string full_file_path = 2;
  string content = 3;
  bool is_directory = 4;
}

message FederationCreateFileOrDirectoryResponse {
  bool success = 1;
  string error = 2;
}

message FederationDownloadFileFromURLRequest {
  string server_id = 1;
  string url = 2;
  string destination_base_path = 3;
}

message FederationDownloadFileFromURLResponse {
  bool success = 1;
  string error = 2;
  string file_path = 3;
}

// Federation RBAC
message FederationListGameServerAccessGrantsRequest {
  string game_server_id = 1;
}

message FederationGameServerAccessGrant {
  string id = 1;
  string user_id = 2;
  string user_name = 3;
  string role_id = 4;
  string role_name = 5;
  string game_server_id = 6;
  string granted_by_user_id = 7;
  string granted_by_user_name = 8;
  google.protobuf.Timestamp created_at = 9;
}

message FederationListGameServerAccessGrantsResponse {
  repeated FederationGameServerAccessGrant grants = 1;
}

message FederationGrantGameServerAccessRequest {
  string game_server_id = 1;
  string user_id = 2;
  string role_id = 3;
}

message FederationGrantGameServerAccessResponse {
  FederationGameServerAccessGrant grant = 1;
}

message FederationRevokeGameServerAccessRequest {
  string grant_id = 1;
}

message FederationRevokeGameServerAccessResponse {}

message FederationListFederatedAccessGrantsRequest {
  string game_server_id = 1;
}

message FederationFederatedAccessGrantInfo {
  string id = 1;
  string game_server_id = 2;
  string remote_node_id = 3;
  string remote_node_name = 4;
  string remote_user_id = 5;
  string remote_user_name = 6;
  string role_id = 7;
  string role_name = 8;
  string granted_by_user_id = 9;
  string granted_by_user_name = 10;
  google.protobuf.Timestamp created_at = 11;
}

message FederationListFederatedAccessGrantsResponse {
  repeated FederationFederatedAccessGrantInfo grants = 1;
}

message FederationGrantFederatedAccessRequest {
  string game_server_id = 1;
  string remote_node_id = 2;
  string remote_user_id = 3;
  string remote_user_name = 4;
  string role_id = 5;
}

message FederationGrantFederatedAccessResponse {
  FederationFederatedAccessGrantInfo grant = 1;
}

message FederationRevokeFederatedAccessRequest {
  string grant_id = 1;
}

message FederationRevokeFederatedAccessResponse {}
