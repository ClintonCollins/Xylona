syntax = "proto3";
import "google/protobuf/timestamp.proto";
import "shared.proto";
import "gameserver_files_operations.proto";
import "websocket.proto";
import "xylona.proto";

package xylona;
option go_package = 'github.com/ClintonCollins/Xylona/proto/go/xylona';

// Federation service for node-to-node communication.
service Federation {
  // Handshake returns the identity and capabilities of this node.
  rpc Handshake (FederationHandshakeRequest) returns (FederationHandshakeResponse) {}

  // ListServerSummaries returns summaries of all local game servers for federation sync.
  rpc ListServerSummaries (FederationListServerSummariesRequest) returns (FederationListServerSummariesResponse) {}

  // ListUserSummaries returns users for on-demand grant workflows.
  rpc ListUserSummaries (FederationListUserSummariesRequest) returns (FederationListUserSummariesResponse) {}

  // GetServerDetail returns detailed info for a single local game server.
  rpc GetServerDetail (FederationGetServerDetailRequest) returns (FederationGetServerDetailResponse) {}

  // StartRemoteServer starts a game server on this node.
  rpc StartRemoteServer (FederationRemoteActionRequest) returns (FederationRemoteActionResponse) {}

  // StopRemoteServer stops a game server on this node.
  rpc StopRemoteServer (FederationRemoteActionRequest) returns (FederationRemoteActionResponse) {}

  // RestartRemoteServer restarts a game server on this node.
  rpc RestartRemoteServer (FederationRemoteActionRequest) returns (FederationRemoteActionResponse) {}

  // UpdateRemoteServer triggers an update for a game server on this node.
  rpc UpdateRemoteServer (FederationRemoteActionRequest) returns (FederationRemoteActionResponse) {}

  // GetRemoteVersionInfo returns cached or newly checked version info for a game server on this node.
  rpc GetRemoteVersionInfo (FederationRemoteActionRequest) returns (FederationVersionInfoResponse) {}

  // CheckRemoteServerForUpdate forces a version check for a game server on this node.
  rpc CheckRemoteServerForUpdate (FederationRemoteActionRequest) returns (FederationVersionInfoResponse) {}

  // EditRemoteServer edits a game server's configuration on this node.
  rpc EditRemoteServer (FederationEditServerRequest) returns (FederationEditServerResponse) {}

  // UpdateRemoteServerStartArgs updates structured start-arg patches for a game server on this node.
  rpc UpdateRemoteServerStartArgs (FederationUpdateServerStartArgsRequest) returns (FederationUpdateServerStartArgsResponse) {}

  // Remote config schema operations on game servers.
  rpc ListRemoteGameServerConfigFiles (FederationGetGameServerConfigFilesRequest) returns (FederationGetGameServerConfigFilesResponse) {}
  rpc GetRemoteGameServerConfigFile (FederationGetGameServerConfigFileRequest) returns (FederationGetGameServerConfigFileResponse) {}
  rpc UpdateRemoteGameServerConfigFile (FederationUpdateGameServerConfigFileRequest) returns (FederationUpdateGameServerConfigFileResponse) {}
  rpc GenerateRemoteGameServerConfigFile (FederationGenerateGameServerConfigFileRequest) returns (FederationGenerateGameServerConfigFileResponse) {}

  // RemoveRemoteServer removes a game server on this node.
  rpc RemoveRemoteServer (FederationRemoteActionRequest) returns (FederationRemoteActionResponse) {}

  // StreamConsoleOutput streams real-time console output for a game server on this node.
  rpc StreamConsoleOutput (FederationStreamConsoleRequest) returns (stream FederationConsoleOutputChunk) {}

  // SendConsoleInput sends a command to a game server's console on this node.
  rpc SendConsoleInput (FederationSendConsoleInputRequest) returns (FederationSendConsoleInputResponse) {}

  // ReadConsoleBuffer returns the current console output buffer for a game server.
  rpc ReadConsoleBuffer (FederationReadConsoleBufferRequest) returns (FederationReadConsoleBufferResponse) {}

  // StreamServerUpdates streams real-time server updates (status, metrics, snapshots) for all game servers on this node.
  rpc StreamServerUpdates (FederationStreamServerUpdatesRequest) returns (stream FederationServerUpdateEvent) {}

  // QueryRemoteServer returns query info (player count, etc.) for a game server on this node.
  rpc QueryRemoteServer (FederationQueryServerRequest) returns (FederationQueryServerResponse) {}

  // File operations on remote servers.
  rpc ListRemoteDirectoryFiles (FederationListDirectoryFilesRequest) returns (FederationListDirectoryFilesResponse) {}
  rpc EditRemoteFile (FederationEditFileRequest) returns (FederationEditFileResponse) {}
  rpc DeleteRemoteFiles (FederationDeleteFilesRequest) returns (FederationDeleteFilesResponse) {}
  rpc RenameRemoteFile (FederationRenameFileRequest) returns (FederationRenameFileResponse) {}
  rpc MoveRemoteFiles (FederationMoveFilesRequest) returns (FederationMoveFilesResponse) {}
  rpc CreateRemoteFileOrDirectory (FederationCreateFileOrDirectoryRequest) returns (FederationCreateFileOrDirectoryResponse) {}
  rpc DownloadRemoteFileFromURL (FederationDownloadFileFromURLRequest) returns (FederationDownloadFileFromURLResponse) {}

  // Dashboard / metrics operations.
  rpc FederationGetNodeSystemInfo (FederationGetNodeSystemInfoRequest) returns (FederationGetNodeSystemInfoResponse) {}
  rpc FederationGetNodeResourceSnapshot (FederationGetNodeResourceSnapshotRequest) returns (FederationGetNodeResourceSnapshotResponse) {}
  rpc FederationGetNodeMetricsHistory (FederationGetNodeMetricsHistoryRequest) returns (FederationGetNodeMetricsHistoryResponse) {}
  rpc FederationGetGameServerMetricsHistory (FederationGetGameServerMetricsHistoryRequest) returns (FederationGetGameServerMetricsHistoryResponse) {}

  // RBAC operations on remote servers.
  rpc ListRemoteGameServerAccessGrants (FederationListGameServerAccessGrantsRequest) returns (FederationListGameServerAccessGrantsResponse) {}
  rpc GrantRemoteGameServerAccess (FederationGrantGameServerAccessRequest) returns (FederationGrantGameServerAccessResponse) {}
  rpc RevokeRemoteGameServerAccess (FederationRevokeGameServerAccessRequest) returns (FederationRevokeGameServerAccessResponse) {}
  rpc ListRemoteFederatedAccessGrants (FederationListFederatedAccessGrantsRequest) returns (FederationListFederatedAccessGrantsResponse) {}
  rpc GrantRemoteFederatedAccess (FederationGrantFederatedAccessRequest) returns (FederationGrantFederatedAccessResponse) {}
  rpc RevokeRemoteFederatedAccess (FederationRevokeFederatedAccessRequest) returns (FederationRevokeFederatedAccessResponse) {}

  // Peer mesh operations
  rpc ExchangePeerList (ExchangePeerListRequest) returns (ExchangePeerListResponse) {}
  rpc NotifyPeerChange (NotifyPeerChangeRequest) returns (NotifyPeerChangeResponse) {}
  rpc NotifyDeparture (NotifyDepartureRequest) returns (NotifyDepartureResponse) {}
}

// Federation Handshake
message FederationHandshakeRequest {
  string secret_key = 1;
}

message FederationHandshakeResponse {
  string node_id = 1;
  string node_name = 2;
  string version = 3;
  int32 protocol_version = 4;
  string capabilities = 5;
  google.protobuf.Timestamp server_time = 6;
  NodeSystemInfo system_info = 7;
  bool departed = 8;
}

// Federation Server Summaries
message FederationListServerSummariesRequest {
  string cursor = 1;
  int32 limit = 2;
}

message FederationServerSummary {
  string server_id = 1;
  string display_name = 2;
  Status status = 3;
  string game_name = 4;
  string game_id = 5;
  string ip_address = 6;
  int64 port = 7;
  int64 query_port = 8;
  int64 max_players = 9;
  int64 current_players = 10;
  string map_name = 11;
  string version = 12;
  google.protobuf.Timestamp updated_at = 13;
  // Process metrics — only populated when the server is running.
  int64 cpu_percent = 14;
  int64 memory_bytes = 15;
  int64 memory_working_set_bytes = 16;
  double memory_percent = 17;
  int32 cpu_cores = 18;
  int32 number_of_threads = 19;
  int64 disk_usage_bytes = 20;
  double io_read_rate = 21;
  double io_write_rate = 22;
  int32 connection_count = 23;
  int64 uptime_seconds = 24;
  VersionInfo version_info = 25;
}

message FederationListServerSummariesResponse {
  repeated FederationServerSummary servers = 1;
  string next_cursor = 2;
  bool has_more = 3;
}

message FederationListUserSummariesRequest {
  int32 limit = 1;
}

message FederationUserSummary {
  string user_id = 1;
  string user_name = 2;
  string email = 3;
  string first_name = 4;
  string last_name = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message FederationListUserSummariesResponse {
  repeated FederationUserSummary users = 1;
}

// Federation Server Detail
message FederationGetServerDetailRequest {
  string server_id = 1;
}

message FederationGetServerDetailResponse {
  FederationServerSummary server = 1;
  repeated string effective_permissions = 2;
}

// Federation Remote Action
message FederationRemoteActionRequest {
  string server_id = 1;
  string acting_user_id = 2;
  string origin_node_id = 3;
  string target = 4;
}

message FederationRemoteActionResponse {
  bool success = 1;
  string error = 2;
}

message FederationVersionInfoResponse {
  VersionInfo version_info = 1;
}

// Federation Edit Server
message FederationEditServerRequest {
  string server_id = 1;
  GameServer game_server = 2;
}

message FederationEditServerResponse {
  bool success = 1;
  string error = 2;
  GameServer game_server = 3;
}

message FederationUpdateServerStartArgsRequest {
  string server_id = 1;
  string start_args_patches = 2;
  string acting_user_id = 3;
  string origin_node_id = 4;
}

message FederationUpdateServerStartArgsResponse {
  bool success = 1;
  string error = 2;
  GameServer game_server = 3;
}

message FederationGetGameServerConfigFilesRequest {
  GetGameServerConfigFilesRequest request = 1;
  string acting_user_id = 2;
  string origin_node_id = 3;
}

message FederationGetGameServerConfigFilesResponse {
  GetGameServerConfigFilesResponse response = 1;
}

message FederationGetGameServerConfigFileRequest {
  GetGameServerConfigFileRequest request = 1;
  string acting_user_id = 2;
  string origin_node_id = 3;
}

message FederationGetGameServerConfigFileResponse {
  GetGameServerConfigFileResponse response = 1;
}

message FederationUpdateGameServerConfigFileRequest {
  UpdateGameServerConfigFileRequest request = 1;
  string acting_user_id = 2;
  string origin_node_id = 3;
}

message FederationUpdateGameServerConfigFileResponse {
  UpdateGameServerConfigFileResponse response = 1;
}

message FederationGenerateGameServerConfigFileRequest {
  GenerateGameServerConfigFileRequest request = 1;
  string acting_user_id = 2;
  string origin_node_id = 3;
}

message FederationGenerateGameServerConfigFileResponse {
  GenerateGameServerConfigFileResponse response = 1;
}

// Federation Console Streaming
message FederationStreamConsoleRequest {
  string server_id = 1;
  string secret_key = 2;
}

message FederationConsoleOutputChunk {
  string server_id = 1;
  string output = 2;
}

message FederationSendConsoleInputRequest {
  string server_id = 1;
  string input = 2;
}

message FederationSendConsoleInputResponse {
  bool success = 1;
  string error = 2;
}

message FederationReadConsoleBufferRequest {
  string server_id = 1;
}

message FederationReadConsoleBufferResponse {
  string output = 1;
}

// Federation Query Server
message FederationQueryServerRequest {
  string server_id = 1;
}

message FederationQueryServerResponse {
  ServerQuery query_info = 1;
}

// Federation File Operations
message FederationListDirectoryFilesRequest {
  string server_id = 1;
  string path = 2;
}

message FederationListDirectoryFilesResponse {
  repeated File files = 1;
}

message FederationEditFileRequest {
  string server_id = 1;
  string full_file_path = 2;
  string content = 3;
}

message FederationEditFileResponse {
  bool success = 1;
  string error = 2;
}

message FederationDeleteFilesRequest {
  string server_id = 1;
  repeated string full_file_paths = 2;
}

message FederationDeleteFilesResponse {
  bool success = 1;
  string error = 2;
  repeated string full_file_paths = 3;
}

message FederationRenameFileRequest {
  string server_id = 1;
  string old_path = 2;
  string new_path = 3;
}

message FederationRenameFileResponse {
  bool success = 1;
  string error = 2;
  string new_path = 3;
}

message FederationMoveFilesRequest {
  string server_id = 1;
  repeated string full_file_paths = 2;
  string destination_base_path = 3;
}

message FederationMoveFilesResponse {
  bool success = 1;
  string error = 2;
  repeated string full_file_paths = 3;
}

message FederationCreateFileOrDirectoryRequest {
  string server_id = 1;
  string full_file_path = 2;
  string content = 3;
  bool is_directory = 4;
}

message FederationCreateFileOrDirectoryResponse {
  bool success = 1;
  string error = 2;
}

message FederationDownloadFileFromURLRequest {
  string server_id = 1;
  string url = 2;
  string destination_base_path = 3;
}

message FederationDownloadFileFromURLResponse {
  bool success = 1;
  string error = 2;
  string file_path = 3;
}

// Federation RBAC
message FederationListGameServerAccessGrantsRequest {
  string game_server_id = 1;
}

message FederationGameServerAccessGrant {
  string id = 1;
  string user_id = 2;
  string user_name = 3;
  string role_id = 4;
  string role_name = 5;
  string game_server_id = 6;
  string granted_by_user_id = 7;
  string granted_by_user_name = 8;
  google.protobuf.Timestamp created_at = 9;
}

message FederationListGameServerAccessGrantsResponse {
  repeated FederationGameServerAccessGrant grants = 1;
}

message FederationGrantGameServerAccessRequest {
  string game_server_id = 1;
  string user_id = 2;
  string role_id = 3;
}

message FederationGrantGameServerAccessResponse {
  FederationGameServerAccessGrant grant = 1;
}

message FederationRevokeGameServerAccessRequest {
  string grant_id = 1;
}

message FederationRevokeGameServerAccessResponse {}

message FederationListFederatedAccessGrantsRequest {
  string game_server_id = 1;
}

message FederationFederatedAccessGrantInfo {
  string id = 1;
  string game_server_id = 2;
  string remote_node_id = 3;
  string remote_node_name = 4;
  string remote_user_id = 5;
  string remote_user_name = 6;
  string role_id = 7;
  string role_name = 8;
  string granted_by_user_id = 9;
  string granted_by_user_name = 10;
  google.protobuf.Timestamp created_at = 11;
}

message FederationListFederatedAccessGrantsResponse {
  repeated FederationFederatedAccessGrantInfo grants = 1;
}

message FederationGrantFederatedAccessRequest {
  string game_server_id = 1;
  string remote_node_id = 2;
  string remote_user_id = 3;
  string remote_user_name = 4;
  string role_id = 5;
}

message FederationGrantFederatedAccessResponse {
  FederationFederatedAccessGrantInfo grant = 1;
}

message FederationRevokeFederatedAccessRequest {
  string grant_id = 1;
}

message FederationRevokeFederatedAccessResponse {}

// Federation Dashboard / Metrics messages

message FederationGetNodeSystemInfoRequest {}

message FederationGetNodeSystemInfoResponse {
  NodeSystemInfo system_info = 1;
}

message FederationGetNodeResourceSnapshotRequest {}

message FederationGetNodeResourceSnapshotResponse {
  NodeResourceSnapshot snapshot = 1;
}

message FederationGetNodeMetricsHistoryRequest {
  google.protobuf.Timestamp since = 1;
  google.protobuf.Timestamp until = 2;
}

message FederationGetNodeMetricsHistoryResponse {
  repeated MetricsHistoryPoint points = 1;
}

message FederationGetGameServerMetricsHistoryRequest {
  string game_server_id = 1;
  google.protobuf.Timestamp since = 2;
  google.protobuf.Timestamp until = 3;
}

message FederationGetGameServerMetricsHistoryResponse {
  repeated GameServerMetricsHistoryPoint points = 1;
}

// Federation streaming — real-time server updates.
message FederationStreamServerUpdatesRequest {
  // Authentication handled by mTLS peer middleware.
}

message FederationServerUpdateEvent {
  oneof event {
    FederationServerSnapshot snapshot = 1;
    FederationServerStatusChange status_change = 2;
    FederationServerMetricsUpdate metrics_update = 3;
    FederationStreamHeartbeat heartbeat = 4;
    FederationServerVersionChange version_change = 5;
    FederationAlertEvent alert_event = 6;
  }
}

message FederationAlertEvent {
  optional string server_id = 1;
  optional string server_node_id = 2;
  optional string node_id = 3;
  AlertEventType event_type = 4;
  string event_data = 5;
  google.protobuf.Timestamp timestamp = 6;
}

message FederationServerSnapshot {
  repeated FederationServerState servers = 1;
}

message FederationServerState {
  string server_id = 1;
  Status status = 2;
  string display_name = 3;
  string game_name = 4;
  string game_id = 5;
  string ip_address = 6;
  int32 port = 7;
  int32 query_port = 8;
  int32 max_players = 9;
  int32 current_players = 10;
  string map_name = 11;
  string version = 12;
  GameServerMetrics metrics = 13;
  VersionInfo version_info = 14;
}

message FederationServerStatusChange {
  string server_id = 1;
  Status status = 2;
  string display_name = 3;
}

message FederationServerMetricsUpdate {
  string server_id = 1;
  GameServerMetrics metrics = 2;
}

message FederationServerVersionChange {
  string server_id = 1;
  string version = 2;
  VersionInfo version_info = 3;
}

message FederationStreamHeartbeat {
}

// Peer Mesh
message PeerInfo {
  string node_id = 1;
  string name = 2;
  string base_url = 3;
  string cert_fingerprint = 4;
  int32 federation_port = 5;
}

message ExchangePeerListRequest {
  string sender_node_id = 1;
  repeated PeerInfo peers = 2;
}

message ExchangePeerListResponse {
  repeated PeerInfo peers = 1;
}

enum PeerChangeType {
  PEER_CHANGE_TYPE_UNSPECIFIED = 0;
  PEER_CHANGE_TYPE_NODE_JOINED = 1;
  PEER_CHANGE_TYPE_NODE_DEPARTED = 2;
  PEER_CHANGE_TYPE_NODE_REVOKED = 3;
}

message NotifyPeerChangeRequest {
  PeerChangeType change_type = 1;
  PeerInfo peer = 2;
  string initiated_by_node_id = 3;
  string initiated_by_node_name = 4;
}

message NotifyPeerChangeResponse {}

message NotifyDepartureRequest {
  string node_id = 1;
  string reason = 2;
}

message NotifyDepartureResponse {}
