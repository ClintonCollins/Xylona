name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go-checks:
    name: Go Lint & Security
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Prepare embedded frontend placeholder
        run: mkdir -p internal/webui/dist && touch internal/webui/dist/.gitkeep

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: --timeout=10m ./...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      - name: Run govulncheck
        run: govulncheck ./...

  go:
    name: Go Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Prepare embedded frontend placeholder
        run: mkdir -p internal/webui/dist && touch internal/webui/dist/.gitkeep

      - name: Run Go tests
        run: go test -race -count=1 ./...

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: frontend/package.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun ci

      - name: Run frontend audit
        working-directory: frontend
        continue-on-error: true
        run: bun audit --audit-level=high

      - name: Run frontend lint
        working-directory: frontend
        run: bun run lint

      - name: Run frontend tests
        working-directory: frontend
        run: bun run test

      - name: Run frontend build
        working-directory: frontend
        run: bun run build
