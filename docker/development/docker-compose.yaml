# Start the controller with HOST=0.0.0.0 so Caddy can reach it through host.docker.internal.
name: xylona-development
services:
  caddy:
    image: caddy:2.11.4-alpine@sha256:df7f1c2fb114453b951de51a98efc010db1655a92c2e86be6706714e2417a78d
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:2019:2019"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
