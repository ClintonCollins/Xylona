version: "2"

run:
  go: "1.26"
  timeout: 5m

linters:
  default: standard
  enable:
    - gocritic
    - misspell
    - nilerr
    - errorlint
    - bodyclose
    - durationcheck
    - makezero
    - noctx
    - reassign
    - wastedassign
    - modernize
    - zerologlint
    - unconvert
    - sqlclosecheck
    - nolintlint
    - usestdlibvars
    - usetesting
    - fatcontext
    - recvcheck
    - nilnil
    - gosec
    - rowserrcheck
    - godot
    - ineffassign
    - predeclared
    - protogetter
    - revive
    - unparam
    - wrapcheck
    - iotamixing
    - errcheck
    - bidichk
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false
    gocritic:
      disabled-checks:
        - singleCaseSwitch
        - assignOp
      enabled-checks:
        - badLock
        - deferInLoop
        - evalOrder
        - externalErrorReassign
        - exposedSyncMutex
        - whyNoLint
        - redundantSprint
        - ptrToRefParam
    revive:
      enable-default-rules: true
      rules:
        # Disable default rule subsumed by early-return
        - name: indent-error-flow
          disabled: true
        # Bug catchers
        - name: atomic
        - name: datarace
        - name: defer
        - name: modifies-value-receiver
        - name: time-equal
        - name: time-date
        - name: constant-logical-expr
        - name: struct-tag
        # Code quality
        - name: early-return
        - name: empty-block
        - name: import-shadowing
        - name: duplicated-imports
        - name: redundant-import-alias
        - name: bool-literal-in-expr
        - name: use-errors-new
        - name: unnecessary-stmt
        - name: get-return
        - name: confusing-naming
    govet:
      enable:
        - shadow
      settings:
        shadow:
          strict: true
  exclusions:
    generated: strict
    presets:
      - common-false-positives
      - std-error-handling

formatters:
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/ClintonCollins/Xylona

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
